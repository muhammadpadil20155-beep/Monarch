 return `<h2>${gl(g)}</h2><p class="mt" style="margin-top:-6px">Setelah beli, masukkan nomor WhatsApp aktif. Admin menghubungi atau mengirim pesananmu lewat WA.</p><div class="row" style="margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto">${cs.map((x,i)=>`<button class="g ${c==x?'on':''}" onclick="S.cat['${g}']=${JSON.stringify(x).replace(/"/g,'&quot;')};render()">${esc(x)}</button>`).join('')}</div><div class="grid">${L.filter(p=>c=='Semua'||p.category==c).map(p=>`<div class="card"><span class="tag">${esc(p.category)}</span>${(S.stats&&S.stats.top||[]).includes(p.id)?'<span class="tag hi">POPULER</span>':''}<h3 style="margin:8px 0 2px">${esc(p.name)}</h3>${p.description?`<div class="mt">${esc(p.description)}</div>`:''}${p.promo?'<span class="tag hi">PROMO</span>':''}<p class="pr">${rp(price(p.price))}${price(p.price)<p.price?` <s class="mt">${rp(p.price)}</s>`:''}</p><button onclick="openBuy(${p.id})">Beli</button></div>`).join('')||'<p class="mt">Belum ada produk.</p>'}</div>`}
const mockSvg=k=>{const r=(x,y,w,h,o=.14,rx=6)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="#fff" fill-opacity="${o}"/>`;
 let b=r(14,36,292,22,.1,8)+r(22,43,60,8,.7,4)+r(268,41,28,12,.25,6);
 if(k=='mod')b+=[0,1,2,3].map(i=>r(14+i*50,66,44,14,i?.12:.8,7)).join('')+[0,1,2].map(i=>r(14+i*99,88,92,74,.1,8)+r(22+i*99,96,50,6,.7,3)+r(22+i*99,108,76,5,.25,3)+r(22+i*99,140,34,12,.85,6)).join('');
 else if(k=='acc')b+=[0,1].map(i=>r(14,66+i*50,292,44,.1,8)+r(22,72+i*50,32,32,.2,6)+r(62,74+i*50,100,7,.7,3)+r(62,87+i*50,150,5,.25,3)+r(62,97+i*50,60,5,.4,3)+r(250,82+i*50,46,16,.85,8)).join('');
 else b+=r(14,66,292,52,.16,10)+r(24,76,120,10,.8,5)+r(24,92,170,6,.3,3)+r(24,104,60,10,.9,5)+[0,1,2,3].map(i=>r(14+i*74,126,68,40,.1,8)+r(20+i*74,132,40,5,.5,3)+r(20+i*74,142,28,5,.25,3)).join('');
 b+=r(24,172,272,18,.12,9)+[0,1,2,3,4].map(i=>`<circle cx="${50+i*55}" cy="181" r="4" fill="#fff" fill-opacity="${i?.4:.9}"/>`).join('');
 return `<svg viewBox="0 0 320 200" style="width:100%;display:block;border-radius:10px;background:#050505;border:1px solid rgba(255,255,255,.15)"><rect width="320" height="26" fill="#111"/>${r(60,7,200,12,.1,6)}${b}</svg>`};
const imgOf=p=>p.img?`<img src="${esc(p.img)}" alt="" style="width:100%;border-radius:10px;display:block">`:mockSvg(p.mock);

function zoom(id){const p=S.prods.find(x=>x.id==id);$('#modal').innerHTML=`<div class="card">${imgOf(p)}<h3>${esc(p.name)}</h3><p class="mt">${esc(p.description)}</p><button class="g" onclick="closeM()">Tutup</button></div>`;$('#modal').style.display='flex'}
function openBuy(id){if(!S.p){toast('Login dulu');return go('login')}const p=S.prods.find(x=>x.id==id);
 $('#modal').innerHTML=`<div class="card"><h3 style="margin-top:0">${esc(p.name)}</h3><p class="mt">${gl(p.game)}</p><div class="sum"><span>Harga</span><b>${rp(price(p.price))}</b></div><div class="sum"><span>Saldo kamu</span><b>${rp(S.p.balance)}</b></div><label>Nomor WhatsApp aktif</label><input id="wa" inputmode="tel" placeholder="08123456789" value="${esc(S.p.wa||'')}"><p class="mt">Admin akan menghubungi atau mengirim pesananmu ke nomor ini lewat WhatsApp setelah pembayaran masuk.</p><div class="row"><button id="bb" onclick="confirmBuy(${id})">Bayar dengan Saldo</button><button class="g" onclick="closeM()">Batal</button></div></div>`;$('#modal').style.display='flex'}
function normWA(v){v=v.replace(/[\s\-+]/g,'');if(v[0]=='0')v='62'+v.slice(1);return /^628\d{7,11}$/.test(v)?v:null}
async function confirmBuy(id){const wa=normWA($('#wa').value);if(!wa)return toast('Nomor WhatsApp tidak valid');$('#bb').disabled=true;
 const {error}=await SB.rpc('buy_product',{p_id:id,p_wa:wa});if(error){$('#bb').disabled=false;return toast(error.message=='Saldo kurang'?'Saldo kurang, hubungi admin untuk top up':error.message)}
 closeM();toast('Pembelian berhasil');await load();go('riwayat')}
async function api(op,d){const {data,error}=await SB.functions.invoke('rotp',{body:{op,...(d||{})}});if(error){let m=error.message;try{const j=await error.context.json();m=j.error||m}catch(e){}return {ok:false,error:m}}return data||{ok:false,error:'Tidak ada respon'}}
async function testApi(){const p=prompt('Path API RumahOTP','/v1/user/balance');if(!p)return;const r=await api('raw',{path:p});alert(JSON.stringify(r).slice(0,900))}
const cp=t=>{navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>toast('Disalin'))};
async function loadNk(){if(S.nk.loading)return;S.nk.loading=true;const r=await api('services');S.nk.loading=false;if(r.ok){S.nk.list=r.list;S.nk.err=null}else S.nk.err=r.error||'Gagal memuat layanan';const e=$('#nkl');if(e)e.innerHTML=nkList()}
function nkSearch(v){S.nk.q=v;$('#nkl').innerHTML=nkList()}
function nkList(){if(S.nk.err)return `<p class="mt">${esc(S.nk.err)}</p><button class="g" onclick="S.nk.err=null;S.nk.list=null;nokosRefresh()">Coba lagi</button>`;if(!S.nk.list)return '<p class="mt">Memuat layanan…</p>';const q=S.nk.q.toLowerCase(),l=S.nk.list.filter(x=>x.name.toLowerCase().includes(q)).slice(0,80);
 return l.map(x=>`<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div><b>${esc(x.name)}</b></div><button onclick="nkPick('${esc(x.id)}')">Pilih</button></div></div>`).join('')||'<p class="mt">Layanan tidak ditemukan.</p>'}
function nokosRefresh(){$('#app').innerHTML=ann()+nokos()}
function nkCard(o){return `<div class="card"><div class="row"><b>${esc(o.name)}</b><span class="tag">Menunggu OTP</span><span class="pr">${rp(o.price)}</span></div><div class="row" style="margin:8px 0"><b style="font-size:20px;letter-spacing:.04em">${esc(o.number)}</b><button class="g" onclick="cp('${esc(o.number)}')">Salin</button></div><p class="mt">Menunggu SMS masuk… dicek otomatis tiap 5 detik.</p><button class="g" onclick="nkCancel(${o.id})">Batalkan & kembalikan saldo</button></div>`}
function nokos(){if(closed('nokos'))return `<h2>Beli Nokos</h2>${closedBox('nokos')}`;if(!S.p)return `<h2>Beli Nokos</h2><div class="card"><p class="mt">Login dulu untuk beli nokos.</p><button onclick="go('login')">Login</button></div>`;
 if(!S.nk.list&&!S.nk.err)loadNk();const act=S.ords.filter(o=>o.kind=='nokos'&&o.user_id==S.u.id&&o.status=='Menunggu OTP');
 return `<h2>Beli Nokos</h2><div class="card"><div class="sum"><span class="mt">Saldo kamu</span><b>${rp(S.p.balance)}</b></div></div>${act.map(nkCard).join('')}<div class="card"><label>Cari layanan</label><input placeholder="WhatsApp, Telegram, Google…" value="${esc(S.nk.q)}" oninput="nkSearch(this.value)"></div><div id="nkl">${nkList()}</div>`}
async function nkPick(id){const x=S.nk.list.find(v=>v.id==id);S.nk.cur=x;$('#modal').innerHTML=`<div class="card"><h3 style="margin-top:0">${esc(x.name)}</h3><p class="mt">Memuat harga…</p></div>`;$('#modal').style.display='flex';const r=await api('prices',{service:id});S.nk.opts=r.ok?r.list:[];
 $('#modal').innerHTML=`<div class="card"><h3 style="margin-top:0">${esc(x.name)}</h3><div class="sum"><span class="mt">Saldo kamu</span><b>${rp(S.p.balance)}</b></div>${r.ok?`<div style="max-height:50vh;overflow-y:auto">${S.nk.opts.map((o,i)=>`<div class="sum" style="align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)"><span>${esc(o.country)} <span class="mt">stok ${esc(o.stock)}</span></span><span><b>${rp(o.price)}</b> <button style="padding:6px 12px" onclick="doBuy(${i})">Beli</button></span></div>`).join('')||'<p class="mt">Tidak ada stok.</p>'}</div>`:`<p class="mt">${esc(r.error)}</p>`}<button class="g" style="margin-top:10px" onclick="closeM()">Tutup</button></div>`}
async function doBuy(i){const o=S.nk.opts[i],x=S.nk.cur;if(!confirm('Beli nomor '+x.name+' ('+o.country+') '+rp(o.price)+'?'))return;closeM();toast('Memproses…');const r=await api('buy',{service:x.id,name:x.name,key:o.key,country:o.country});if(!r.ok)return toast(r.error||'Gagal membeli');toast('Nomor didapat, menunggu OTP');await load()}

async function nkCancel(id){if(!confirm('Batalkan pesanan dan kembalikan saldo?'))return;const r=await api('cancel',{order_id:id});if(!r.ok)return toast(r.error||'Gagal membatalkan');toast('Dibatalkan, saldo kembali');await load()}
let pollT=null,pollBusy=false;
function startPoll(){if(pollT)return;pollT=setInterval(async()=>{if(pollBusy)return;const act=S.ords.filter(o=>o.kind=='nokos'&&S.u&&o.user_id==S.u.id&&o.status=='Menunggu OTP');if(!act.length){clearInterval(pollT);pollT=null;return}pollBusy=true;let ch=false;for(const o of act){const r=await api('status',{order_id:o.id});if(r.ok&&r.status!='Menunggu OTP'){ch=true;toast(r.status=='Selesai'?'OTP masuk: '+r.otp:'Pesanan '+r.status.toLowerCase())}}pollBusy=false;if(ch)await load()},5000)}
function drawQR(){const d=(S.deps||[]).find(x=>x.id==S.dview),b=$('#qrbox');if(!d||!b||!d.qr_string)return;if(d.qr_string.startsWith('data:image')){b.innerHTML='<img alt="QRIS" style="width:240px;height:240px;display:block" src="'+esc(d.qr_string)+'">';return}if(typeof QRCode=='undefined')return;b.innerHTML='';new QRCode(b,{text:d.qr_string,width:240,height:240,correctLevel:QRCode.CorrectLevel.M})}
function topup(){const d=S.dview&&(S.deps||[]).find(x=>x.id==S.dview);if(d)return d.qr_string?payView(d):payViewM(d);return S.set.topup_mode=='rumahotp'?topupAuto():topupM()}
function topupM(){const mine=S.deps||[],pend=mine.filter(dpPending),n=S.tn,af=+S.set.admin_fee||0;
 return `<h2>Top Up Saldo</h2><div class="card"><div class="sum"><span class="mt">Saldo kamu</span><b>${rp(S.p.balance)}</b></div></div>${pend.map(d=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(d.method)} · ${rp(d.total_pay)}</b><span class="tag">${d.paid_claim?'Menunggu owner':'Menunggu bayar'}</span></div><button style="margin-top:8px" onclick="S.dview=${d.id};render()">Lanjutkan bayar</button></div>`).join('')}<div class="card"><b>Pilih nominal</b><div class="row" style="margin:10px 0">${NOMINALS.map(v=>`<button class="g ${n==v?'on':''}" onclick="pickTn(${v})">${rp(v)}</button>`).join('')}</div><b>Metode pembayaran</b><div class="row" style="margin:10px 0">${['QRIS','DANA'].map(m=>`<button class="g ${S.tm==m?'on':''}" onclick="pickTm('${m}')">${m}</button>`).join('')}</div>${n?`<div class="sum"><span>Nominal (masuk ke saldo)</span><b>${rp(n)}</b></div><div class="sum"><span>Admin toko</span><b>${rp(af)}</b></div><p class="mt">Kode unik 1-99 ditambahkan otomatis agar pembayaranmu mudah dicek. Total pasti tampil setelah tombol ditekan.</p><button id="mkb" onclick="mkDep()">Buat Pembayaran ${S.tm}</button>`:'<p class="mt">Pilih nominal dulu.</p>'}</div>${mine.filter(d=>!dpPending(d)).slice(0,5).map(d=>`<div class="sum"><span>${rp(d.amount)} · ${esc(d.method||'')} <span class="mt">${now(d.created_at)}</span></span><span class="tag">${esc(d.status)}</span></div>`).join('')}`}
function payViewM(d){const ok=d.status=='Menunggu',q=S.set.qris_img,dn=S.set.dana_number;
 return `<h2>Bayar ${esc(d.method)}</h2><div class="card"><div class="sum"><span>Nominal (masuk ke saldo)</span><b>${rp(d.amount)}</b></div><div class="sum"><span>Admin & kode unik</span><b>${rp(d.total_pay-d.amount)}</b></div><div class="sum" style="border-top:1px solid var(--bd);margin-top:6px;padding-top:8px"><span>Total bayar</span><b class="pr" style="font-size:20px">${rp(d.total_pay)}</b></div>${ok?`<p class="mt">Bayar <b style="color:#fff">persis ${rp(d.total_pay)}</b> (sudah termasuk kode unik) supaya cepat dikonfirmasi.</p>${d.method=='QRIS'?(q?`<img src="${esc(q)}" alt="QRIS" style="width:100%;max-width:320px;background:#fff;border-radius:12px;padding:10px;display:block;margin:10px auto">`:'<p class="mt">QRIS belum diunggah owner.</p>'):`<div class="card" style="margin:10px 0"><div class="mt">Transfer DANA ke</div><b style="font-size:20px;letter-spacing:.04em">${esc(dn||'-')}</b><div class="mt">a.n. ${esc(S.set.dana_name||'-')}</div>${dn?`<button class="g" style="margin-top:8px" onclick="cp('${esc(dn)}')">Salin nomor</button>`:''}</div>`}<p class="mt">${d.paid_claim?'Menunggu owner mengonfirmasi. Halaman ini update otomatis. ':'Setelah bayar, tekan "Saya sudah bayar". '}Berlaku sampai ${jam(d.expired_at)}.</p>`:`<p class="mt">Status: ${esc(d.status)}</p>`}<div class="row">${ok&&!d.paid_claim?`<button onclick="claimDep(${d.id})">Saya sudah bayar</button>`:''}<button class="g" onclick="S.dview=null;render()">Kembali</button></div></div>`}
async function claimDep(id){const {error}=await SB.rpc('deposit_claim',{p_id:id});if(error)return toast(error.message);toast('Dikirim ke owner, tunggu konfirmasi');await load()}
async function depOk(id){const d=S.alld.find(x=>x.id==id);if(!confirm('Setujui '+rp(d.amount)+' untuk '+un(d.user_id)+'? Pastikan uang '+rp(d.total_pay)+' sudah masuk.'))return;const {data,error}=await SB.rpc('deposit_approve',{p_id:id});if(error||!data.ok)return toast((error&&error.message)||data.error);toast('Saldo ditambahkan');await load()}
async function depNo(id){if(!confirm('Tolak deposit ini?'))return;const {error}=await SB.rpc('deposit_reject',{p_id:id});if(error)return toast(error.message);await load()}
async function pickQris(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{const f=i.files[0];if(!f)return;const path='qris-'+Date.now()+'.'+(f.name.split('.').pop()||'png').toLowerCase(),r=await SB.storage.from('foto').upload(path,f,{contentType:f.type||'image/png'});if(fail(r))return;const u=SB.storage.from('foto').getPublicUrl(path).data.publicUrl;if(fail(await SB.from('settings').upsert({key:'qris_img',value:u})))return;toast('QRIS tersimpan');await load()};i.click()}
function pickTn(v){S.tn=v;$('#app').innerHTML=ann()+topup()}
function pickTm(m){S.tm=m;$('#app').innerHTML=ann()+topup()}
const dpPending=d=>d.status=='Menunggu'&&new Date(d.expired_at).getTime()>Date.now()-60000;
const jam=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
function payView(d){return `<h2>Bayar dengan QRIS</h2><div class="card">${d.status=='Menunggu'&&d.qr_string?`<div id="qrbox" style="background:#fff;border-radius:12px;padding:12px;width:fit-content;margin:0 auto 12px"></div><p class="mt" style="text-align:center;margin-top:-4px">Scan pakai DANA, OVO, GoPay, ShopeePay, atau m-banking</p>`:''}<div class="sum"><span>Nominal (masuk ke saldo)</span><b>${rp(d.amount)}</b></div><div class="sum"><span>Admin & biaya</span><b>${rp(d.total_pay-d.amount)}</b></div><div class="sum" style="border-top:1px solid var(--bd);margin-top:6px;padding-top:8px"><span>Total bayar</span><b class="pr">${rp(d.total_pay)}</b></div><p class="mt">${d.status=='Menunggu'?'Menunggu pembayaran, dicek otomatis tiap 5 detik. Berlaku sampai '+jam(d.expired_at)+'.':'Status: '+esc(d.status)}</p>${d.status=='Menunggu'?`<div class="row" style="margin-bottom:10px">${d.checkout_url?`<a class="btn" style="background:transparent;color:#fff;border:1px solid var(--bd)" target="_blank" rel="noopener" href="${esc(d.checkout_url)}">Halaman pembayaran</a>`:''}</div>`:''}<div class="row"><button class="g" onclick="chkDep(${d.id})">Cek pembayaran</button><button class="g" onclick="S.dview=null;render()">Kembali</button></div></div>`}
function topupAuto(){const mine=S.deps||[],pend=mine.filter(dpPending),n=S.tn,af=+S.set.admin_fee||0;
 if(S.dview){const d=mine.find(x=>x.id==S.dview);if(d)return payView(d)}
 return `<h2>Top Up Saldo</h2><div class="card"><div class="sum"><span class="mt">Saldo kamu</span><b>${rp(S.p.balance)}</b></div></div>${pend.map(d=>`<div class="card"><div class="row" style="justify-content:space-between"><b>QRIS · ${rp(d.total_pay)}</b><span class="tag">Menunggu bayar</span></div><button style="margin-top:8px" onclick="S.dview=${d.id};render()">Lanjutkan bayar</button></div>`).join('')}<div class="card"><b>Pilih nominal</b><div class="row" style="margin:10px 0">${NOMINALS.map(v=>`<button class="g ${n==v?'on':''}" onclick="pickTn(${v})">${rp(v)}</button>`).join('')}</div><p class="mt">Pembayaran lewat <b style="color:#fff">QRIS</b>, bisa dibayar pakai DANA, OVO, GoPay, ShopeePay, atau m-banking.</p>${n?`<div class="sum"><span>Nominal (masuk ke saldo)</span><b>${rp(n)}</b></div><div class="sum"><span>Admin toko</span><b>${rp(af)}</b></div><p class="mt">Biaya QRIS dihitung otomatis dan tampil jelas sebelum kamu bayar.</p><button id="mkb" onclick="mkDep()">Buat QRIS</button>`:'<p class="mt">Pilih nominal dulu.</p>'}</div>${mine.filter(d=>!dpPending(d)).slice(0,5).map(d=>`<div class="sum"><span>${rp(d.amount)} · ${esc(d.method||'')} <span class="mt">${now(d.created_at)}</span></span><span class="tag">${esc(d.status)}</span></div>`).join('')}`}
async function mkDep(){const b=$('#mkb');if(b){b.disabled=true;b.textContent='Membuat pembayaran…'}const {data,error}=S.set.topup_mode=='rumahotp'?{data:await api('dep_create',{amount:S.tn})}:await SB.rpc('deposit_manual',{p_amount:S.tn,p_method:S.tm});if(error||!data||!data.ok){toast((error&&error.message)||(data&&data.error)||'Gagal membuat pembayaran');return render()}S.dview=data.id;await load()}
async function chkDep(id,silent){const data=await api('dep_check',{id});if(!data||!data.ok){if(!silent)toast((data&&data.error)||'Gagal cek');return}if(data.status=='Berhasil'){toast('Pembayaran diterima, saldo bertambah');S.dview=null;await load()}else if(data.status!='Menunggu'){toast('Pembayaran '+String(data.status).toLowerCase());S.dview=null;await load()}else if(!silent)toast('Belum dibayar')}
let dpT=null,dpBusy=false;
function startDepPoll(){if(dpT)return;dpT=setInterval(async()=>{if(dpBusy)return;const p=(S.deps||[]).filter(dpPending);if(!p.length||!S.u){clearInterval(dpT);dpT=null;return}dpBusy=true;for(const d of p)await chkDep(d.id,true);dpBusy=false},5000)}
function riwayat(){const l=S.ords.filter(o=>o.user_id==S.u.id);return `<h2>Riwayat Pesanan</h2>${l.map(o=>`<div class="card"><div class="row"><b>${gl(o.kind)}: ${esc(o.name)}</b><span class="tag">${esc(o.status)}</span><span class="pr">${rp(o.price)}</span></div><div class="mt">${now(o.created_at)}</div>${o.kind=='nokos'?`<p class="mt">Nomor <b style="color:#fff">${esc(o.number||'-')}</b>${o.otp?` · OTP <b style="color:#fff">${esc(o.otp)}</b>`:''}</p>`:`<p class="mt">Admin akan menghubungi atau mengirim pesananmu ke WhatsApp <b style="color:#fff">${esc(o.wa)}</b>.</p>`}</div>`).join('')||'<p class="mt">Belum ada pesanan.</p>'}`}
function admin(){const T=[['ord','Pesanan'],['usr','User'],['dep','Deposit'],['prd','Produk'],['pgs','Halaman'],['set','Toko']],un=id=>(S.users.find(u=>u.id==id)||{}).username||'?';let b='';
 if(S.tab=='ord')b=`<p class="mt">${S.users.length} user · ${S.ords.length} pesanan · omzet ${rp(S.ords.reduce((a,o)=>a+o.price,0))}</p>`+(S.ords.map(o=>{if(o.kind=='nokos')return `<div class="card"><div class="row"><b>${esc(o.name)}</b><span class="tag">Nokos</span><span class="tag">${esc(o.status)}</span></div><p class="mt" style="margin:4px 0">${esc(un(o.user_id))} · ${esc(o.number||'-')} · ${rp(o.price)}</p></div>`;const p=S.prods.find(x=>x.id==o.product_id);return `<div class="card"><div class="row"><b>${esc(o.name)}</b><span class="tag">${gl(o.kind)}</span><span class="tag">${esc(o.status)}</span></div><p class="mt" style="margin:4px 0">${esc(un(o.user_id))} · WA ${esc(o.wa)} · ${rp(o.price)}</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(o.wa)}?text=${encodeURIComponent('Halo, pesanan '+o.name+' kamu sudah kami proses.'+(p&&p.link?' Link: '+p.link:''))}">Chat WhatsApp</a> ${o.status!='Terkirim'?`<button class="g" onclick="setSt(${o.id})">Tandai Terkirim</button>`:''}</div>`}).join('')||'<p class="mt">Belum ada pesanan.</p>');
 if(S.tab=='usr')b=`<div class="card tw"><table><tr><th>User</th><th>Level</th><th>Saldo</th><th></th></tr>${S.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${lvTag(u.level)}</td><td>${rp(u.balance)}</td><td>${u.level!='owner'?`<button class="g" onclick="setLv('${u.id}','${u.level=='high'?'member':'high'}')">${u.level=='high'?'Jadikan Member':'Jadikan HIGH'}</button> <button class="g" onclick="addBal('${u.id}')">+Saldo</button>`:''}</td></tr>`).join('')}</table></div>`;
 if(S.tab=='prd')b=`<div class="card"><h3 style="margin-top:0">Tambah Produk</h3><select id="pg"><option value="samp">Modpack SAMP</option><option value="jasa">Jasa SAMP</option><option value="host">Hosting</option><option value="web">Jasa Website</option></select><input id="pn" placeholder="Nama"><input id="pc" placeholder="Kategori"><input id="pd" placeholder="Deskripsi singkat"><input id="pp" type="number" placeholder="Harga"><input id="pl" placeholder="Link file (dikirim lewat WA)"><label>Foto (opsional)</label><input id="pf" type="file" accept="image/*"><button onclick="addP()">Tambah</button></div><div class="card tw"><table>${S.prods.map(p=>`<tr><td>${gl(p.game)}</td><td>${esc(p.name)}</td><td>${rp(p.price)}</td><td><button class="g" onclick="pickImg(${p.id})">Foto</button> <button class="d" onclick="delP(${p.id})">Hapus</button></td></tr>`).join('')}</table></div>`;
 if(S.tab=='dep'){const pe=S.alld.filter(d=>d.status=='Menunggu'&&!d.qr_string&&Date.now()-new Date(d.created_at)<3*864e5),dn=S.alld.filter(d=>!pe.includes(d)).slice(0,10);b=`<button class="g" onclick="load()">Muat ulang</button><p class="mt">Cek uang masuk di aplikasi DANA/bank kamu. Cocokkan dengan total bayar (ada kode uniknya), lalu tekan Setujui.</p>${pe.map(d=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(un(d.user_id))} · ${esc(d.method)}</b>${d.paid_claim?'<span class="tag hi">Sudah klik bayar</span>':'<span class="tag">Belum klik bayar</span>'}</div><p class="mt" style="margin:6px 0">Saldo masuk <b style="color:#fff">${rp(d.amount)}</b> · Harus transfer <b style="color:#fff">${rp(d.total_pay)}</b><br>${now(d.created_at)}</p><div class="row"><button onclick="depOk(${d.id})">Setujui</button><button class="d" onclick="depNo(${d.id})">Tolak</button></div></div>`).join('')||'<p class="mt">Tidak ada deposit yang menunggu.</p>'}${dn.map(d=>`<div class="sum"><span>${esc(un(d.user_id))} · ${rp(d.amount)} <span class="mt">${now(d.created_at)}</span></span><span class="tag">${esc(d.status)}</span></div>`).join('')}`}
 if(S.tab=='pgs')b=`<div class="card"><h3 style="margin-top:0">Tambah Halaman</h3><p class="mt">Upload file .html atau tempel kodenya. Halaman langsung muncul di menu tanpa deploy ulang. Berjalan di kotak aman (tidak bisa akses akun pengunjung).</p><input id="gt" placeholder="Judul halaman (nama menu)"><input id="gf" type="file" accept=".html,.htm,text/html"><textarea id="gh" placeholder="atau tempel kode HTML di sini"></textarea><button onclick="addPg()">Simpan Halaman</button></div><div class="card"><b>Upload file lain</b><p class="mt" style="margin:2px 0 8px">Gambar, zip, apk, dll. Dapat link publik untuk ditaruh di produk atau halaman.</p><button class="g" onclick="upFile()">Pilih file</button></div>`+(S.pages.map(p=>`<div class="card"><div class="row"><b>${esc(p.title)}</b><span class="tag">${p.show?'Tampil':'Disembunyikan'}</span></div><div class="row" style="margin-top:8px"><button class="g" onclick="openPg(${p.id})">Lihat</button><button class="g" onclick="replacePg(${p.id})">Ganti file</button><button class="g" onclick="togPg(${p.id},${!p.show})">${p.show?'Sembunyikan':'Tampilkan'}</button><button class="d" onclick="delPg(${p.id})">Hapus</button></div></div>`).join('')||'<p class="mt">Belum ada halaman.</p>');
 if(S.tab=='set')b=`<div class="card"><h3 style="margin-top:0">Pengaturan Toko</h3><label>Nama toko</label><div class="row" style="margin-bottom:8px">${['Monarch','Secret','Jefri'].map(n=>`<button class="g ${S.name==n?'on':''}" onclick="$('#nm').value='${n}'">${n}</button>`).join('')}</div><input id="nm" value="${esc(S.name)}"><label>Nomor WhatsApp admin (format 628xxx)</label><input id="aw" inputmode="tel" value="${esc(S.wa)}"><label>Markup nokos (Rp). 0 = sama dengan harga RumahOTP</label><input id="mk" type="number" value="${S.mk}"><label>Admin toko untuk top up (Rp)</label><input id="af" type="number" value="${+S.set.admin_fee||0}"><div class="card" style="margin:8px 0"><b>Promo kilat (tampil di Beranda dengan hitung mundur)</b><input id="pt" placeholder="Contoh: Diskon 20% semua modpack" value="${esc(S.set.promo_text||'')}"><label>Berakhir pada</label><input id="pu" type="datetime-local" value="${locDt(S.set.promo_until)}"></div><div class="card" style="margin:8px 0"><b>Update terbaru (tampil di Beranda)</b><input id="cl" placeholder="Contoh: Ditambah modpack STYLE BARU"><button class="g" onclick="addLog()">Tambah Update</button>${getLog().slice(0,6).map((x,i)=>`<div class="sum"><span class="mt">${esc(x.t)}</span><button class="g" style="padding:4px 10px" onclick="delLog(${i})">Hapus</button></div>`).join('')}</div><button class="g" style="margin-bottom:10px" onclick="testApi()">Tes API RumahOTP</button><label>Mode top up</label><select id="tmo"><option value="manual" ${S.set.topup_mode!='rumahotp'?'selected':''}>Manual: QRIS/DANA milikmu, owner setujui</option><option value="rumahotp" ${S.set.topup_mode=='rumahotp'?'selected':''}>Otomatis: QRIS RumahOTP, saldo masuk sendiri</option></select><label>Nomor DANA</label><input id="dn" inputmode="numeric" value="${esc(S.set.dana_number||'')}"><label>Nama pemilik DANA</label><input id="dnm" value="${esc(S.set.dana_name||'')}"><label>Foto QRIS</label>${S.set.qris_img?`<img src="${esc(S.set.qris_img)}" alt="" style="width:140px;border-radius:10px;display:block;margin-bottom:8px;background:#fff">`:''}<button class="g" onclick="pickQris()">Upload foto QRIS</button><label>Pengumuman di semua halaman (kosongkan untuk menyembunyikan)</label><input id="an" value="${esc(S.set.announce||'')}"><button onclick="saveSet()">Simpan</button></div><div class="card"><h3 style="margin-top:0">Buka / Tutup Layanan</h3><label>Pesan untuk pelanggan saat ditutup</label><input id="cm" value="${esc(S.set.close_msg||'')}" placeholder="Sedang update, kembali sebentar lagi">${[['samp','Modpack SAMP'],['jasa','Jasa SAMP'],['host','Hosting'],['web','Jasa Website'],['nokos','Nokos OTP']].map(x=>`<div class="sum" style="align-items:center"><span>${x[1]}</span><button class="${closed(x[0])?'d':'g'}" onclick="toggleClose('${x[0]}')">${closed(x[0])?'TUTUP · ketuk untuk buka':'Buka · ketuk untuk tutup'}</button></div>`).join('')}</div>`;
 return `<h2>Panel Owner</h2><div class="row" style="margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto">${T.map(t=>`<button class="g ${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${b}`}
const fail=r=>{if(r.error){toast(r.error.message);return true}};
async function setSt(id){if(fail(await SB.from('orders').update({status:'Terkirim'}).eq('id',id)))return;await load()}
async function setLv(id,l){if(fail(await SB.from('profiles').update({level:l}).eq('id',id)))return;await load()}
async function addBal(id){const v=+prompt('Tambah saldo (Rp):');if(!v)return;const u=S.users.find(x=>x.id==id);if(fail(await SB.from('profiles').update({balance:u.balance+v}).eq('id',id)))return;toast('Saldo ditambahkan');await load()}
async function delP(id){if(!confirm('Hapus produk ini?'))return;if(fail(await SB.from('products').delete().eq('id',id)))return;await load()}
const shrink=f=>new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,720/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.75)};i.onerror=()=>res(null);i.src=URL.createObjectURL(f)});
async function upImg(f){const b=await shrink(f);if(!b){toast('Gambar tidak valid');return null}const path=Date.now()+'.jpg',r=await SB.storage.from('foto').upload(path,b,{contentType:'image/jpeg'});if(fail(r))return null;return SB.storage.from('foto').getPublicUrl(path).data.publicUrl}
async function addP(){const name=$('#pn').value.trim(),price=+$('#pp').value;if(!name||!price)return toast('Isi nama & harga');const f=$('#pf').files[0];let img=null;if(f){img=await upImg(f);if(!img)return}
 if(fail(await SB.from('products').insert({game:$('#pg').value,name,category:$('#pc').value.trim()||'Lainnya',price,description:$('#pd').value.trim(),link:$('#pl').value.trim(),img,mock:'store'})))return;toast('Produk ditambahkan');await load()}
function pickImg(id){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(!i.files[0])return;const u=await upImg(i.files[0]);if(u&&!fail(await SB.from('products').update({img:u}).eq('id',id))){toast('Foto disimpan');await load()}};i.click()}
async function saveSet(){const r=await SB.from('settings').upsert([{key:'store_name',value:$('#nm').value.trim()||'Monarch'},{key:'admin_wa',value:$('#aw').value.replace(/\D/g,'')},{key:'markup',value:String(Math.max(0,+$('#mk').value||0))},{key:'announce',value:$('#an').value.trim()},{key:'admin_fee',value:String(Math.max(0,+$('#af').value||0))},{key:'topup_mode',value:$('#tmo').value},{key:'dana_number',value:$('#dn').value.replace(/\D/g,'')},{key:'dana_name',value:$('#dnm').value.trim()},{key:'promo_text',value:$('#pt').value.trim()},{key:'promo_until',value:$('#pu').value?new Date($('#pu').value).toISOString():''}]);if(fail(r))return;toast('Tersimpan');await load()}
function login(){return `<div class="card auth"><h2>Login</h2><label>Username</label><input id="lu" autocapitalize="none"><label>Password</label><input id="lp" type="password"><button id="lb" onclick="doLogin()">Masuk</button> <button class="g" onclick="go('register')">Daftar</button></div>`}
async function doLogin(){const u=$('#lu').value.trim().toLowerCase();if(!u)return toast('Isi username');$('#lb').disabled=true;const {error}=await SB.auth.signInWithPassword({email:u+'@monarch.app',password:$('#lp').value});
 if(error){$('#lb').disabled=false;return toast('Username/password salah')}await load();go(S.p&&S.p.level=='owner'?'admin':'home')}
function register(){return `<div class="card auth"><h2>Daftar Akun</h2><label>Username (huruf kecil/angka)</label><input id="ru" autocapitalize="none"><label>Password (min 6)</label><input id="rp" type="password"><label>Ulangi password</label><input id="rp2" type="password"><button id="rb" onclick="doReg()">Daftar</button> <button class="g" onclick="go('login')">Login</button></div>`}
async function doReg(){const u=$('#ru').value.trim().toLowerCase(),p=$('#rp').value;if(!/^[a-z0-9_]{3,15}$/.test(u))return toast('Username 3-15 huruf kecil/angka');if(p.length<6)return toast('Password min 6');if(p!=$('#rp2').value)return toast('Password tidak sama');$('#rb').disabled=true;
 const {data,error}=await SB.auth.signUp({email:u+'@monarch.app',password:p});if(error){$('#rb').disabled=false;return toast(error.message.includes('already')?'Username sudah dipakai':error.message)}
 if(!data.session){$('#rb').disabled=false;return toast('Pendaftaran butuh konfirmasi. Matikan Confirm email di Supabase')}toast('Berhasil daftar');await load();go('home')}
async function logout(){await SB.auth.signOut();await load();go('home')}
// ===== FITUR: UPDATE OTOMATIS, PROMO, STATISTIK =====
let lastSig='',verHash=null;
const sigOf=()=>JSON.stringify([S.prods,S.set,S.rev,S.pages,S.p&&[S.p.balance,S.p.level],(S.ords||[]).map(o=>[o.id,o.status,o.otp]),(S.deps||[]).map(d=>[d.id,d.status]),S.stats,S.recent]);
const busyUI=()=>{const a=document.activeElement;return $('#modal').style.display=='flex'||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))||['login','register','rating','pg'].includes(S.page)||(S.page=='admin'&&['prd','pgs','set'].includes(S.tab))};
function silentApply(){
 if(S._pb!=null&&S.p&&S.p.balance>S._pb)toast('Saldo bertambah '+rp(S.p.balance-S._pb));
 (S.ords||[]).forEach(o=>{const w=S._prev&&S._prev[o.id];if(w&&w!=o.status&&S.u&&o.user_id==S.u.id&&o.kind!='nokos')toast('Pesanan "'+o.name+'" kini: '+o.status)});
 const g=sigOf();if(g==lastSig||busyUI())return;lastSig=g;const y=window.scrollY;render();window.scrollTo(0,y)}
async function loadExtra(){try{const [a,b]=await Promise.all([SB.rpc('site_stats'),SB.rpc('recent_activity')]);S.stats=a.error?null:a.data;S.recent=b.error?[]:(b.data||[])}catch(e){S.stats=null;S.recent=[]}}
const hsh=t=>{let h=0;for(let i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))|0;return h};
async function checkVer(){try{const r=await fetch(location.href.split('#')[0],{cache:'no-store'});if(!r.ok)return;const h=hsh(await r.text());if(verHash===null){verHash=h;return}
 if(h!=verHash&&!$('#upd')){const d=document.createElement('div');d.id='upd';d.style.cssText='position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:40;background:#fff;color:#000;padding:10px 14px;border-radius:14px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.6);max-width:94%';d.innerHTML='Versi baru tersedia <button style="padding:6px 12px;background:#000;color:#fff" onclick="location.reload()">Muat ulang</button>';document.body.appendChild(d)}}catch(e){}}
const getLog=()=>{try{return JSON.parse(S.set.changelog||'[]')}catch(e){return[]}};
const locDt=v=>{if(!v)return'';const d=new Date(v);return isNaN(d)?'':new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16)};
async function saveLog(a){if(fail(await SB.from('settings').upsert([{key:'changelog',value:JSON.stringify(a.slice(0,20))}])))return;toast('Update tersimpan');await load()}
function addLog(){const t=$('#cl').value.trim();if(!t)return toast('Tulis isi update');const a=getLog();a.unshift({d:new Date().toISOString(),t:t.slice(0,140)});saveLog(a)}
function delLog(i){const a=getLog();a.splice(i,1);saveLog(a)}
const ago=t=>{const m=Math.max(1,Math.round((Date.now()-new Date(t))/6e4));return m<60?m+' menit lalu':m<1440?Math.round(m/60)+' jam lalu':Math.round(m/1440)+' hari lalu'};
function promoCard(){const u=new Date(S.set.promo_until||0).getTime();if(!S.set.promo_text||!(u>Date.now()))return'';
 return `<div class="card" style="border-color:#fff"><div class="row" style="justify-content:space-between"><span class="tag hi">PROMO KILAT</span><b id="pcd" data-t="${u}" style="font-variant-numeric:tabular-nums">--:--:--</b></div><b style="display:block;margin-top:8px;font-size:17px">${esc(S.set.promo_text)}</b><p class="mt" style="margin:2px 0 0">Berakhir otomatis saat hitung mundur habis.</p></div>`}
function homeExtra(){const st=S.stats,lg=getLog().slice(0,4),a=avgRev();let h='';
 if(st)h+=`<div class="grid" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">${[['Member',st.users],['Pesanan selesai',st.orders],['Rating',S.rev.length?a.toFixed(1):'-']].map(x=>`<div class="card" style="text-align:center;margin:0;padding:12px 6px"><b class="cu" data-n="${esc(x[1])}" style="font-size:22px">${esc(x[1])}</b><div class="mt">${x[0]}</div></div>`).join('')}</div>`;
 if(lg.length)h+=`<h3 style="margin:14px 0 8px">Update terbaru</h3><div class="card">${lg.map(x=>`<div class="sum" style="gap:10px;align-items:flex-start"><span>${Date.now()-new Date(x.d)<6048e5?'<span class="tag hi">BARU</span> ':''}${esc(x.t)}</span><span class="mt" style="white-space:nowrap">${ago(x.d)}</span></div>`).join('')}</div>`;
 if((S.recent||[]).length)h+=`<h3 style="margin:14px 0 8px">Pembelian terbaru</h3><div class="card">${S.recent.slice(0,5).map(x=>`<div class="sum" style="gap:10px"><span><b>${esc(x.who)}</b> beli ${esc(x.name)}</span><span class="mt" style="white-space:nowrap">${ago(x.t)}</span></div>`).join('')}</div>`;
 return h}
function afterRender(){document.querySelectorAll('.cu').forEach(e=>{const n=+e.dataset.n;if(!n||n<2)return;const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/900);e.textContent=Math.round(n*(1-Math.pow(1-k,3))).toLocaleString('id-ID');if(k<1)requestAnimationFrame(f)})(t0)});tickPromo()}
function tickPromo(){const e=$('#pcd');if(!e)return;const l=+e.dataset.t-Date.now();if(l<=0){if(S.page=='home')render();return}const z=n=>String(n).padStart(2,'0'),d=Math.floor(l/864e5);e.textContent=(d?d+'h ':'')+z(Math.floor(l/36e5)%24)+':'+z(Math.floor(l/6e4)%60)+':'+z(Math.floor(l/1e3)%60)}
async function shareSite(){const u=location.href.split('#')[0],t=S.name+' - modpack, jasa SAMP, hosting, nokos';try{if(navigator.share)await navigator.share({title:S.name,text:t,url:u});else{await navigator.clipboard.writeText(u);toast('Link toko disalin')}}catch(e){}}
setInterval(tickPromo,1000);
setInterval(()=>{if(!document.hidden)load(true)},30000);
setInterval(()=>{if(!document.hidden)checkVer()},120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){load(true);checkVer()}});
checkVer();
load();
</script></body></html>
