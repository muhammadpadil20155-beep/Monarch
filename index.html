const closed=k=>S.set['closed_'+k]=='1',closedBox=k=>`<div class="card"><b>Sedang ditutup</b><p class="mt" style="margin:4px 0 0">${esc(S.set.close_msg||'Layanan ini sedang ditutup sementara karena update. Coba lagi nanti.')}</p></div>`;

const hi=()=>S.p&&S.p.level!='member',price=x=>hi()?Math.round(x*.9):x,now=d=>new Date(d).toLocaleString('id-ID');
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000)};
const go=p=>{S.page=p;render()},tm=()=>$('#menu').classList.toggle('open'),closeM=()=>$('#modal').style.display='none';
const lvTag=l=>`<span class="tag ${l!='member'?'hi':''}">${esc(l).toUpperCase()}</span>`;

async function load(){
 const {data:{session}}=await SB.auth.getSession();S.u=session?session.user:null;S.p=null;S.ords=[];S.users=[];
 const [pr,st,rv,pg]=await Promise.all([SB.from('products').select('*').order('id'),SB.from('settings').select('*'),SB.from('reviews').select('*').order('id',{ascending:false}),SB.from('pages').select('*').order('id')]);
 S.prods=pr.data||[];S.rev=rv.data||[];S.pages=pg.data||[];S.set={};(st.data||[]).forEach(r=>{S.set[r.key]=r.value;if(r.key=='store_name')S.name=r.value;if(r.key=='markup')S.mk=+r.value||0;if(r.key=='admin_wa')S.wa=r.value});
 if(S.u){const {data}=await SB.from('profiles').select('*').eq('id',S.u.id).single();S.p=data;
  S.ords=(await SB.from('orders').select('*').order('id',{ascending:false})).data||[];
  if(S.p&&S.p.level=='owner')S.users=(await SB.from('profiles').select('*').order('username')).data||[]}
 render()}
function render(){const m=S.p;
 if(['topup','riwayat','admin'].includes(S.page)&&!m){toast('Login dulu');S.page='login'}
 if(S.page=='admin'&&m.level!='owner')S.page='home';
 $('#sn').textContent=S.name.toUpperCase();document.title=S.name;
 $('#nav').innerHTML=[['home','Beranda'],['samp','Modpack'],['jasa','Jasa'],['host','Hosting'],['nokos','Nokos'],['topup','Top Up']].map(x=>`<button class="${S.page==x[0]?'on':''}" onclick="go('${x[0]}')">${IC[x[0]]}${x[1]}</button>`).join('');
 $('#who').innerHTML=(m?`<span class="mt">${lvTag(m.level)} <b class="pr" style="color:#fff">${rp(m.balance)}</b></span>`:'')+`<button class="ib" aria-label="Menu" onclick="event.stopPropagation();tm()">${IC.dots}</button>`;
 const it=[['web','Jasa Website'],['rating','Rating'],...(m?[['riwayat','Riwayat'],...(m.level=='owner'?[['admin','Panel Owner']]:[]),['out','Keluar']]:[['login','Login'],['register','Daftar']])];
 $('#menu').innerHTML=(m?`<div class="mt" style="padding:6px 12px">Masuk sebagai <b>${esc(m.username)}</b></div>`:'')+it.map(x=>`<button onclick="${x[0]=='out'?'logout()':`go('${x[0]}')`}">${IC[x[0]]}${x[1]}</button>`).join('')+S.pages.filter(p=>p.show).map(p=>`<button onclick="openPg(${p.id})">${IC.page}${esc(p.title)}</button>`).join('');
 $('#menu').classList.remove('open');
 $('#app').innerHTML=ann()+({home,samp:()=>store('samp'),jasa:()=>store('jasa'),host:()=>store('host'),rating,pg:pageView,web:webPage,nokos,topup,riwayat,admin,login,register}[S.page])();window.scrollTo(0,0);if(S.u&&S.ords.some(o=>o.kind=='nokos'&&o.status=='Menunggu OTP'))startPoll()}
function home(){const t=(p,n,d)=>`<div class="card" onclick="go('${p}')" style="cursor:pointer"><div style="width:28px">${IC[p]}</div><b>${n}</b><p class="mt" style="margin:2px 0 0">${d}</p></div>`,a=avgRev(),faq=(q,x)=>`<details class="card"><summary style="cursor:pointer;font-weight:700">${q}</summary><p class="mt" style="margin:8px 0 0">${x}</p></details>`;
 return `<div class="hero"><h1 style="margin:0 0 6px">${esc(S.name)}</h1><p style="margin:0 0 14px;color:var(--mt)">Modpack, jasa SAMP, hosting, pembuatan website, dan nomor OTP.</p><div class="row"><button onclick="go('${S.p?'samp':'register'}')">${S.p?'Lihat Modpack':'Daftar Sekarang'}</button>${S.wa?`<a class="btn" style="background:transparent;color:#fff;border:1px solid var(--bd)" target="_blank" rel="noopener" href="https://wa.me/${esc(S.wa)}">Chat Admin</a>`:''}</div></div><div class="grid">${t('samp','Modpack SAMP','Compe, Gengster, JGRP, Robbery')}${t('jasa','Jasa SAMP','Pasang mods & buat skin')}${t('host','Hosting','Panel Pterodactyl, VPS, RDP')}${t('web','Jasa Website','Bikin website toko, mulai Rp10.000')}${t('nokos','Nokos OTP','Nomor OTP otomatis, OTP masuk langsung')}</div>
 <div class="card" onclick="go('rating')" style="cursor:pointer"><div class="row" style="justify-content:space-between"><b>Rating pelanggan</b><span class="pr">${S.rev.length?a.toFixed(1)+' / 5':'Belum ada'}</span></div><div style="font-size:22px;letter-spacing:3px;color:#ffd54a">${starStr(a)}</div><p class="mt" style="margin:2px 0 0">${S.rev.length} ulasan · ketuk untuk beri rating</p></div>
 ${S.rev.filter(r=>r.comment).slice(0,2).map(r=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(r.username||'User')}</b><span style="color:#ffd54a;letter-spacing:2px">${starStr(r.stars)}</span></div><p class="mt" style="margin:4px 0 0">${esc(r.comment)}</p></div>`).join('')}
 <h3 style="margin:18px 0 8px">Pertanyaan umum</h3>${faq('Bagaimana cara beli?','Daftar akun, top up saldo, pilih produk, lalu bayar pakai saldo. Admin memproses dan mengirim lewat WhatsApp.')}${faq('Bagaimana cara top up?','Buka menu Top Up, pilih nominal, lalu bayar QRIS ke admin. Saldo masuk setelah pembayaran dikonfirmasi.')}${faq('OTP nokos tidak masuk?','Batalkan pesanan di halaman Nokos, saldo kembali otomatis. Pesanan tanpa OTP lebih dari 15 menit juga dibatalkan otomatis.')}${faq('Apa itu level HIGH?','Akun HIGH mendapat diskon 10% untuk produk toko.')}`}
function rating(){const l=S.rev,n=l.length,a=avgRev(),mine=S.u&&l.find(r=>r.user_id==S.u.id);
 if(S.rsFor!==(S.u?S.u.id:0)){S.rs=mine?mine.stars:5;S.rsFor=S.u?S.u.id:0}
 const bar=k=>{const c=l.filter(r=>r.stars==k).length;return `<div class="row" style="flex-wrap:nowrap;gap:8px"><span class="mt" style="width:28px">${k} ★</span><div style="flex:1;height:8px;border-radius:9px;background:var(--bd);overflow:hidden"><div style="width:${n?c/n*100:0}%;height:100%;background:#ffd54a"></div></div><span class="mt" style="width:24px;text-align:right">${c}</span></div>`};
 return `<h2>Rating ${esc(S.name)}</h2><div class="card"><div class="row" style="align-items:flex-end"><span style="font-size:42px;font-weight:800;line-height:1">${n?a.toFixed(1):'-'}</span><span class="mt">dari 5 · ${n} ulasan</span></div><div style="font-size:24px;letter-spacing:3px;color:#ffd54a;margin:6px 0 10px">${starStr(a)}</div>${[5,4,3,2,1].map(bar).join('')}</div>${S.p?`<div class="card"><b>${mine?'Ubah ulasanmu':'Beri rating'}</b><div id="stp" class="row" style="margin:10px 0">${starPick()}</div><textarea id="rc" maxlength="300" placeholder="Ceritakan pengalamanmu (opsional)">${esc(mine?mine.comment:'')}</textarea><button onclick="sendRev()">Kirim</button></div>`:`<div class="card"><p class="mt">Login untuk memberi rating.</p><button onclick="go('login')">Login</button></div>`}${l.map(r=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${esc(r.username||'User')}</b><span style="color:#ffd54a;letter-spacing:2px">${starStr(r.stars)}</span></div>${r.comment?`<p style="margin:6px 0">${esc(r.comment)}</p>`:''}<div class="row" style="justify-content:space-between"><span class="mt">${now(r.created_at)}</span>${S.p&&S.p.level=='owner'?`<button class="d" onclick="delRev(${r.id})">Hapus</button>`:''}</div></div>`).join('')}`}
const starPick=()=>[1,2,3,4,5].map(i=>`<button class="g" style="padding:6px 12px;font-size:22px;${i<=S.rs?'color:#ffd54a;border-color:#ffd54a':''}" onclick="pickStar(${i})">★</button>`).join(' ');

const readTxt=f=>f.size>600000?(toast('File terlalu besar (maks 600 KB)'),Promise.resolve(null)):f.text();
async function addPg(){const title=$('#gt').value.trim(),f=$('#gf').files[0];let html=$('#gh').value;if(f)html=await readTxt(f);if(!title||!html||!html.trim())return toast('Isi judul dan file/kode HTML');if(fail(await SB.from('pages').insert({title,html,show:true})))return;toast('Halaman ditambahkan');await load()}
function replacePg(id){const i=document.createElement('input');i.type='file';i.accept='.html,.htm,text/html';i.onchange=async()=>{if(!i.files[0])return;const h=await readTxt(i.files[0]);if(h&&!fail(await SB.from('pages').update({html:h}).eq('id',id))){toast('Isi halaman diperbarui');await load()}};i.click()}

function upFile(){const i=document.createElement('input');i.type='file';i.onchange=async()=>{const f=i.files[0];if(!f)return;if(f.size>20000000)return toast('Maks 20 MB');const path='file/'+Date.now()+'-'+f.name.replace(/[^\w.\-]/g,'_');const r=await SB.storage.from('foto').upload(path,f);if(fail(r))return;const u=SB.storage.from('foto').getPublicUrl(path).data.publicUrl;try{await navigator.clipboard.writeText(u)}catch(e){}prompt('Link file (sudah disalin):',u)};i.click()}

function store(g){if(closed(g))return `<h2>${gl(g)}</h2>${closedBox(g)}`;const L=S.prods.filter(p=>p.game==g),cs=['Semua',...new Set(L.map(p=>p.category))],c=S.cat[g];
 return `<h2>${gl(g)}</h2><p class="mt" style="margin-top:-6px">Setelah beli, masukkan nomor WhatsApp aktif. Admin menghubungi atau mengirim pesananmu lewat WA.</p><div class="row" style="margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto">${cs.map((x,i)=>`<button class="g ${c==x?'on':''}" onclick="S.cat['${g}']=${JSON.stringify(x).replace(/"/g,'&quot;')};render()">${esc(x)}</button>`).join('')}</div><div class="grid">${L.filter(p=>c=='Semua'||p.category==c).map(p=>`<div class="card"><span class="tag">${esc(p.category)}</span><h3 style="margin:8px 0 2px">${esc(p.name)}</h3>${p.description?`<div class="mt">${esc(p.description)}</div>`:''}${p.promo?'<span class="tag hi">PROMO</span>':''}<p class="pr">${rp(price(p.price))}${price(p.price)<p.price?` <s class="mt">${rp(p.price)}</s>`:''}</p><button onclick="openBuy(${p.id})">Beli</button></div>`).join('')||'<p class="mt">Belum ada produk.</p>'}</div>`}
const mockSvg=k=>{const r=(x,y,w,h,o=.14,rx=6)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="#fff" fill-opacity="${o}"/>`;
 let b=r(14,36,292,22,.1,8)+r(22,43,60,8,.7,4)+r(268,41,28,12,.25,6);
 if(k=='mod')b+=[0,1,2,3].map(i=>r(14+i*50,66,44,14,i?.12:.8,7)).join('')+[0,1,2].map(i=>r(14+i*99,88,92,74,.1,8)+r(22+i*99,96,50,6,.7,3)+r(22+i*99,108,76,5,.25,3)+r(22+i*99,140,34,12,.85,6)).join('');
 else if(k=='acc')b+=[0,1].map(i=>r(14,66+i*50,292,44,.1,8)+r(22,72+i*50,32,32,.2,6)+r(62,74+i*50,100,7,.7,3)+r(62,87+i*50,150,5,.25,3)+r(62,97+i*50,60,5,.4,3)+r(250,82+i*50,46,16,.85,8)).join('');
 else b+=r(14,66,292,52,.16,10)+r(24,76,120,10,.8,5)+r(24,92,170,6,.3,3)+r(24,104,60,10,.9,5)+[0,1,2,3].map(i=>r(14+i*74,126,68,40,.1,8)+r(20+i*74,132,40,5,.5,3)+r(20+i*74,142,28,5,.25,3)).join('');
 b+=r(24,172,272,18,.12,9)+[0,1,2,3,4].map(i=>`<circle cx="${50+i*55}" cy="181" r="4" fill="#fff" fill-opacity="${i?.4:.9}"/>`).join('');
 return `<svg viewBox="0 0 320 200" style="width:100%;display:block;border-radius:10px;background:#050505;border:1px solid rgba(255,255,255,.15)"><rect width="320" height="26" fill="#111"/>${r(60,7,200,12,.1,6)}${b}</svg>`};
const imgOf=p=>p.img?`<img src="${esc(p.img)}" alt="" style="width:100%;border-radius:10px;display:block">`:mockSvg(p.mock);

function zoom(id){const p=S.prods.find(x=>x.id==id);$('#modal').innerHTML=`<div class="card">${imgOf(p)}<h3>${esc(p.name)}</h3><p class="mt">${esc(p.description)}</p><button class="g" onclick="closeM()">Tutup</button></div>`;$('#modal').style.display='flex'}
function openBuy(id){if(!S.p){toast('Login dulu');return go('login')}const p=S.prods.find(x=>x.id==id);
 $('#modal').innerHTML=`<div class="card"><h3 style="margin-top:0">${esc(p.name)}</h3><p class="mt">${gl(p.game)}</p><div class="sum"><span>Harga</span><b>${rp(price(p.price))}</b></div><div class="sum"><span>Saldo kamu</span><b>${rp(S.p.balance)}</b></div><label>Nomor WhatsApp aktif</label><input id="wa" inputmode="tel" placeholder="08123456789" value="${esc(S.p.wa||'')}"><p class="mt">Admin akan menghubungi atau mengirim pesananmu ke nomor ini lewat WhatsApp setelah pembayaran masuk.</p><div class="row"><button id="bb" onclick="confirmBuy(${id})">Bayar dengan Saldo</button><button class="g" onclick="closeM()">Batal</button></div></div>`;$('#modal').style.display='flex'}
function normWA(v){v=v.replace(/[\s\-+]/g,'');if(v[0]=='0')v='62'+v.slice(1);return /^628\d{7,11}$/.test(v)?v:null}
async function confirmBuy(id){const wa=normWA($('#wa').value);if(!wa)return toast('Nomor WhatsApp tidak valid');$('#bb').disabled=true;
 const {error}=await SB.rpc('buy_product',{p_id:id,p_wa:wa});if(error){$('#bb').disabled=false;return toast(error.message=='Saldo kurang'?'Saldo kurang, hubungi admin untuk top up':error.message)}
 closeM();toast('Pembelian berhasil');await load();go('riwayat')}
async function api(op,d){d=d||{};const m={services:['nokos_services',{}],buy:['nokos_buy',{p_service:d.service,p_operator:d.operator}],status:['nokos_status',{p_oid:d.order_id}],cancel:['nokos_cancel',{p_oid:d.order_id}]}[op];const {data,error}=await SB.rpc(m[0],m[1]);if(error)return {ok:false,error:error.message};return data||{ok:false,error:'Tidak ada respon'}}

 if(!S.nk.list&&!S.nk.err)loadNk();const act=S.ords.filter(o=>o.kind=='nokos'&&o.user_id==S.u.id&&o.status=='Menunggu OTP');

let pollT=null,pollBusy=false;

function pickTn(v){S.tn=v;$('#app').innerHTML=ann()+topup()}
function topup(){const n=S.tn,fee=FEE_VIRTUSIM+FEE_ADMIN,tot=n+fee;
 const wa=n&&S.wa?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(S.wa)}?text=${encodeURIComponent('Halo admin, saya mau top up saldo '+rp(n)+' (total bayar '+rp(tot)+' via QRIS). Username: '+S.p.username)}">Bayar via WhatsApp Admin</a>`:(n?'<p class="mt">Kontak admin belum diatur.</p>':'');
 return `<h2>Top Up Saldo</h2><div class="card"><div class="sum"><span class="mt">Saldo kamu</span><b>${rp(S.p.balance)}</b></div></div><div class="card"><b>Pilih nominal</b><div class="row" style="margin:10px 0">${NOMINALS.map(v=>`<button class="g ${n==v?'on':''}" onclick="pickTn(${v})">${rp(v)}</button>`).join('')}</div>${n?`<div class="sum"><span>Nominal (masuk ke saldo)</span><b>${rp(n)}</b></div><div class="sum"><span>Admin QRIS VirtuSIM</span><b>${rp(FEE_VIRTUSIM)}</b></div><div class="sum"><span>Admin toko</span><b>${rp(FEE_ADMIN)}</b></div><div class="sum" style="border-top:1px solid var(--bd);margin-top:6px;padding-top:8px"><span>Total bayar</span><b class="pr">${rp(tot)}</b></div><p class="mt">Bayar lewat QRIS ke admin. Saldo ${rp(n)} ditambahkan setelah pembayaran dikonfirmasi.</p>${wa}`:'<p class="mt">Pilih nominal dulu.</p>'}</div>`}

function admin(){const T=[['ord','Pesanan'],['usr','User'],['prd','Produk'],['pgs','Halaman'],['set','Toko']],un=id=>(S.users.find(u=>u.id==id)||{}).username||'?';let b='';

 if(S.tab=='usr')b=`<div class="card tw"><table><tr><th>User</th><th>Level</th><th>Saldo</th><th></th></tr>${S.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${lvTag(u.level)}</td><td>${rp(u.balance)}</td><td>${u.level!='owner'?`<button class="g" onclick="setLv('${u.id}','${u.level=='high'?'member':'high'}')">${u.level=='high'?'Jadikan Member':'Jadikan HIGH'}</button> <button class="g" onclick="addBal('${u.id}')">+Saldo</button>`:''}</td></tr>`).join('')}</table></div>`;
 if(S.tab=='prd')b=`<div class="card"><h3 style="margin-top:0">Tambah Produk</h3><select id="pg"><option value="samp">Modpack SAMP</option><option value="jasa">Jasa SAMP</option><option value="host">Hosting</option><option value="web">Jasa Website</option></select><input id="pn" placeholder="Nama"><input id="pc" placeholder="Kategori"><input id="pd" placeholder="Deskripsi singkat"><input id="pp" type="number" placeholder="Harga"><input id="pl" placeholder="Link file (dikirim lewat WA)"><label>Foto (opsional)</label><input id="pf" type="file" accept="image/*"><button onclick="addP()">Tambah</button></div><div class="card tw"><table>${S.prods.map(p=>`<tr><td>${gl(p.game)}</td><td>${esc(p.name)}</td><td>${rp(p.price)}</td><td><button class="g" onclick="pickImg(${p.id})">Foto</button> <button class="d" onclick="delP(${p.id})">Hapus</button></td></tr>`).join('')}</table></div>`;
 if(S.tab=='pgs')b=`<div class="card"><h3 style="margin-top:0">Tambah Halaman</h3><p class="mt">Upload file .html atau tempel kodenya. Halaman langsung muncul di menu tanpa deploy ulang. Berjalan di kotak aman (tidak bisa akses akun pengunjung).</p><input id="gt" placeholder="Judul halaman (nama menu)"><input id="gf" type="file" accept=".html,.htm,text/html"><textarea id="gh" placeholder="atau tempel kode HTML di sini"></textarea><button onclick="addPg()">Simpan Halaman</button></div><div class="card"><b>Upload file lain</b><p class="mt" style="margin:2px 0 8px">Gambar, zip, apk, dll. Dapat link publik untuk ditaruh di produk atau halaman.</p><button class="g" onclick="upFile()">Pilih file</button></div>`+(S.pages.map(p=>`<div class="card"><div class="row"><b>${esc(p.title)}</b><span class="tag">${p.show?'Tampil':'Disembunyikan'}</span></div><div class="row" style="margin-top:8px"><button class="g" onclick="openPg(${p.id})">Lihat</button><button class="g" onclick="replacePg(${p.id})">Ganti file</button><button class="g" onclick="togPg(${p.id},${!p.show})">${p.show?'Sembunyikan':'Tampilkan'}</button><button class="d" onclick="delPg(${p.id})">Hapus</button></div></div>`).join('')||'<p class="mt">Belum ada halaman.</p>');
 if(S.tab=='set')b=`<div class="card"><h3 style="margin-top:0">Pengaturan Toko</h3><label>Nama toko</label><div class="row" style="margin-bottom:8px">${['Monarch','Secret','Jefri'].map(n=>`<button class="g ${S.name==n?'on':''}" onclick="$('#nm').value='${n}'">${n}</button>`).join('')}</div><input id="nm" value="${esc(S.name)}"><label>Nomor WhatsApp admin (format 628xxx)</label><input id="aw" inputmode="tel" value="${esc(S.wa)}"><label>Markup nokos (Rp). 0 = sama dengan harga VirtuSIM</label><input id="mk" type="number" value="${S.mk}"><label>Pengumuman di semua halaman (kosongkan untuk menyembunyikan)</label><input id="an" value="${esc(S.set.announce||'')}"><button onclick="saveSet()">Simpan</button></div><div class="card"><h3 style="margin-top:0">Buka / Tutup Layanan</h3><label>Pesan untuk pelanggan saat ditutup</label><input id="cm" value="${esc(S.set.close_msg||'')}" placeholder="Sedang update, kembali sebentar lagi">${[['samp','Modpack SAMP'],['jasa','Jasa SAMP'],['host','Hosting'],['web','Jasa Website'],['nokos','Nokos OTP']].map(x=>`<div class="sum" style="align-items:center"><span>${x[1]}</span><button class="${closed(x[0])?'d':'g'}" onclick="toggleClose('${x[0]}')">${closed(x[0])?'TUTUP · ketuk untuk buka':'Buka · ketuk untuk tutup'}</button></div>`).join('')}</div>`;
 return `<h2>Panel Owner</h2><div class="row" style="margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto">${T.map(t=>`<button class="g ${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${b}`}
const fail=r=>{if(r.error){toast(r.error.message);return true}};
async function setSt(id){if(fail(await SB.from('orders').update({status:'Terkirim'}).eq('id',id)))return;await load()}
async function setLv(id,l){if(fail(await SB.from('profiles').update({level:l}).eq('id',id)))return;await load()}
async function addBal(id){const v=+prompt('Tambah saldo (Rp):');if(!v)return;const u=S.users.find(x=>x.id==id);if(fail(await SB.from('profiles').update({balance:u.balance+v}).eq('id',id)))return;toast('Saldo ditambahkan');await load()}
async function delP(id){if(!confirm('Hapus produk ini?'))return;if(fail(await SB.from('products').delete().eq('id',id)))return;await load()}
const shrink=f=>new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,720/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.75)};i.onerror=()=>res(null);i.src=URL.createObjectURL(f)});
async function upImg(f){const b=await shrink(f);if(!b){toast('Gambar tidak valid');return null}const path=Date.now()+'.jpg',r=await SB.storage.from('foto').upload(path,b,{contentType:'image/jpeg'});if(fail(r))return null;return SB.storage.from('foto').getPublicUrl(path).data.publicUrl}
async function addP(){const name=$('#pn').value.trim(),price=+$('#pp').value;if(!name||!price)return toast('Isi nama & harga');const f=$('#pf').files[0];let img=null;if(f){img=await upImg(f);if(!img)return}
 if(fail(await SB.from('products').insert({game:$('#pg').value,name,category:$('#pc').value.trim()||'Lainnya',price,description:$('#pd').value.trim(),link:$('#pl').value.trim(),img,mock:'store'})))return;toast('Produk ditambahkan');await load()}
function pickImg(id){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(!i.files[0])return;const u=await upImg(i.files[0]);if(u&&!fail(await SB.from('products').update({img:u}).eq('id',id))){toast('Foto disimpan');await load()}};i.click()}
async function saveSet(){const r=await SB.from('settings').upsert([{key:'store_name',value:$('#nm').value.trim()||'Monarch'},{key:'admin_wa',value:$('#aw').value.replace(/\D/g,'')},{key:'markup',value:String(Math.max(0,+$('#mk').value||0))},{key:'announce',value:$('#an').value.trim()}]);if(fail(r))return;toast('Tersimpan');await load()}
function login(){return `<div class="card auth"><h2>Login</h2><label>Username</label><input id="lu" autocapitalize="none"><label>Password</label><input id="lp" type="password"><button id="lb" onclick="doLogin()">Masuk</button> <button class="g" onclick="go('register')">Daftar</button></div>`}
async function doLogin(){const u=$('#lu').value.trim().toLowerCase();if(!u)return toast('Isi username');$('#lb').disabled=true;const {error}=await SB.auth.signInWithPassword({email:u+'@monarch.app',password:$('#lp').value});
 if(error){$('#lb').disabled=false;return toast('Username/password salah')}await load();go(S.p&&S.p.level=='owner'?'admin':'home')}
function register(){return `<div class="card auth"><h2>Daftar Akun</h2><label>Username (huruf kecil/angka)</label><input id="ru" autocapitalize="none"><label>Password (min 6)</label><input id="rp" type="password"><label>Ulangi password</label><input id="rp2" type="password"><button id="rb" onclick="doReg()">Daftar</button> <button class="g" onclick="go('login')">Login</button></div>`}
async function doReg(){const u=$('#ru').value.trim().toLowerCase(),p=$('#rp').value;if(!/^[a-z0-9_]{3,15}$/.test(u))return toast('Username 3-15 huruf kecil/angka');if(p.length<6)return toast('Password min 6');if(p!=$('#rp2').value)return toast('Password tidak sama');$('#rb').disabled=true;
 const {data,error}=await SB.auth.signUp({email:u+'@monarch.app',password:p});if(error){$('#rb').disabled=false;return toast(error.message.includes('already')?'Username sudah dipakai':error.message)}
 if(!data.session){$('#rb').disabled=false;return toast('Pendaftaran butuh konfirmasi. Matikan Confirm email di Supabase')}toast('Berhasil daftar');await load();go('home')}
async function logout(){await SB.auth.signOut();await load();go('home')}
load();
