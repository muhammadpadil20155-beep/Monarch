<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">

<style>
:root{--bg:#030303;--card:rgba(12,12,12,.34);--bd:rgba(255,255,255,.13);--tx:#f5f5f5;--mt:#9a9a9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:500 15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;padding-bottom:120px;background-color:var(--bg);background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:38px 38px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 15% 15%,rgba(255,255,255,.12),transparent 40%),radial-gradient(circle at 90% 70%,rgba(255,255,255,.09),transparent 45%)}
body::after{content:"";position:fixed;z-index:-1;pointer-events:none;width:280px;height:280px;border-radius:50%;background:#fff;opacity:.2;top:16%;right:-70px;box-shadow:-520px 380px 0 -30px rgba(255,255,255,.16)}
header,.card,nav,.modal{-webkit-backdrop-filter:blur(44px) saturate(1.2);backdrop-filter:blur(44px) saturate(1.2)}
header{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(0,0,0,.3);border-bottom:1px solid var(--bd);z-index:5;padding:10px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:16px;letter-spacing:.16em;display:flex;align-items:center;gap:9px}.logo svg{width:24px;height:24px}
button,.btn{font-family:inherit;background:#fff;color:#000;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.g.on{border-color:#fff;background:#fff;color:#000}button.d{background:#3a3a3a;color:#fff}
.ib{width:40px;height:40px;padding:0;border-radius:50%;background:transparent;color:#fff;border:1px solid var(--bd);display:grid;place-items:center}.ib svg{width:20px;height:20px;fill:currentColor;stroke:none}
.menu{position:absolute;right:12px;top:calc(100% + 8px);min-width:220px;border:1px solid var(--bd);border-radius:18px;padding:8px;background:rgba(10,10,10,.92);display:none;box-shadow:0 14px 40px rgba(0,0,0,.7)}.menu.open{display:block}
.menu button{width:100%;display:flex;gap:12px;align-items:center;background:transparent;color:var(--tx);text-align:left;padding:12px;border-radius:12px}.menu svg{width:20px;height:20px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 20px);max-width:640px;z-index:6;display:flex;gap:4px;padding:9px;border-radius:30px;background:rgba(10,10,10,.3);border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 40px rgba(0,0,0,.6)}
nav button{flex:1;min-width:0;background:transparent;color:var(--mt);border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:12px 2px}nav button svg{width:26px;height:26px}nav button.on{color:#000;background:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);box-shadow:0 8px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}

input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:rgba(0,0,0,.55);color:var(--tx);margin:4px 0 10px;font:inherit;font-size:14px}
label{font-size:13px;color:var(--mt)}h1,h2,h3{font-weight:800;letter-spacing:-.02em}h2{margin:6px 0 12px}.mt{color:var(--mt);font-size:13px}.pr{font-weight:800}
.tag{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--bd);margin-right:4px}.hi{background:#fff;color:#000}
.hero{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border-radius:16px;padding:28px 18px;margin-bottom:14px;border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.auth{max-width:380px;margin:30px auto}.sum{display:flex;justify-content:space-between;padding:4px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.modal .card{width:100%;max-width:400px;background:rgba(14,14,14,.85)}
#toast{position:fixed;bottom:calc(128px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:99px;font-weight:700;display:none;z-index:30;max-width:92%;text-align:center}
</style></head><body>
<header><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 18h18M4 18L3 7l5 4 4-7 4 7 5-4-1 11"/></svg><span id="sn">MONARCH</span></span><div id="who" class="row"></div><div id="menu" class="menu"></div></header>
<main id="app"><p class="mt">Memuat…</p></main><nav id="nav"></nav><div id="modal" class="modal" onclick="if(event.target==this)closeM()"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SB=supabase.createClient('https://spgxbywytohyanpjuqda.supabase.co','sb_publishable_RWJ6bFIDlIFbg6nnBF5U-g_y2k9wREM');
const $=s=>document.querySelector(s),rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sv=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={home:sv('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'),samp:sv('<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'),jasa:sv('<path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>'),web:sv('<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>'),nokos:sv('<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>'),topup:sv('<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/>'),riwayat:sv('<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),admin:sv('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'),login:sv('<path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/>'),register:sv('<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/>'),out:sv('<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>'),dots:'<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>'};
const S={u:null,p:null,prods:[],ords:[],users:[],page:'home',tab:'ord',name:'Monarch',mk:0,wa:'',cat:{samp:'Semua',jasa:'Semua'}};
const gl=g=>({samp:'Modpack SAMP',jasa:'Jasa SAMP',web:'Jasa Website'}[g]||'Produk');
const hi=()=>S.p&&S.p.level!='member',price=x=>hi()?Math.round(x*.9):x,now=d=>new Date(d).toLocaleString('id-ID');
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000)};
const go=p=>{S.page=p;render()},tm=()=>$('#menu').classList.toggle('open'),closeM=()=>$('#modal').style.display='none';
const lvTag=l=>`<span class="tag ${l!='member'?'hi':''}">${esc(l).toUpperCase()}</span>`;
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('#menu').classList.remove('open')});
async function load(){
 const {data:{session}}=await SB.auth.getSession();S.u=session?session.user:null;S.p=null;S.ords=[];S.users=[];
 const [pr,st]=await Promise.all([SB.from('products').select('*').order('id'),SB.from('settings').select('*')]);
 S.prods=pr.data||[];(st.data||[]).forEach(r=>{if(r.key=='store_name')S.name=r.value;if(r.key=='markup')S.mk=+r.value||0;if(r.key=='admin_wa')S.wa=r.value});
 if(S.u){const {data}=await SB.from('profiles').select('*').eq('id',S.u.id).single();S.p=data;
  S.ords=(await SB.from('orders').select('*').order('id',{ascending:false})).data||[];
  if(S.p&&S.p.level=='owner')S.users=(await SB.from('profiles').select('*').order('username')).data||[]}
 render()}
function render(){const m=S.p;
 if(['topup','riwayat','admin'].includes(S.page)&&!m){toast('Login dulu');S.page='login'}
 if(S.page=='admin'&&m.level!='owner')S.page='home';
 $('#sn').textContent=S.name.toUpperCase();document.title=S.name;
 $('#nav').innerHTML=[['home','Beranda'],['samp','Modpack'],['jasa','Jasa'],['nokos','Nokos'],['topup','Top Up']].map(x=>`<button class="${S.page==x[0]?'on':''}" onclick="go('${x[0]}')">${IC[x[0]]}${x[1]}</button>`).join('');
 $('#who').innerHTML=(m?`<span class="mt">${lvTag(m.level)} <b class="pr" style="color:#fff">${rp(m.balance)}</b></span>`:'')+`<button class="ib" aria-label="Menu" onclick="event.stopPropagation();tm()">${IC.dots}</button>`;
 const it=[['web','Jasa Website'],...(m?[['riwayat','Riwayat'],...(m.level=='owner'?[['admin','Panel Owner']]:[]),['out','Keluar']]:[['login','Login'],['register','Daftar']])];
 $('#menu').innerHTML=(m?`<div class="mt" style="padding:6px 12px">Masuk sebagai <b>${esc(m.username)}</b></div>`:'')+it.map(x=>`<button onclick="${x[0]=='out'?'logout()':`go('${x[0]}')`}">${IC[x[0]]}${x[1]}</button>`).join('');
 $('#menu').classList.remove('open');
 $('#app').innerHTML=({home,samp:()=>store('samp'),jasa:()=>store('jasa'),web:webPage,nokos,topup,riwayat,admin,login,register}[S.page])();window.scrollTo(0,0)}
function home(){const t=(p,n,d)=>`<div class="card" onclick="go('${p}')" style="cursor:pointer"><div style="width:28px">${IC[p]}</div><b>${n}</b><p class="mt" style="margin:2px 0 0">${d}</p></div>`;
 return `<div class="hero"><h1 style="margin:0 0 6px">${esc(S.name)}</h1><p style="margin:0 0 14px;color:var(--mt)">Modpack, jasa SAMP, pembuatan website, dan nomor OTP.</p><button onclick="go('${S.p?'samp':'register'}')">${S.p?'Lihat Modpack':'Daftar Sekarang'}</button></div><div class="grid">${t('samp','Modpack SAMP','Compe, Gengster, JGRP, Robbery')}${t('jasa','Jasa SAMP','Pasang mods & buat skin')}${t('web','Jasa Website','Bikin website toko, mulai Rp10.000')}${t('nokos','Nokos OTP','Segera aktif')}</div>`}
function store(g){const L=S.prods.filter(p=>p.game==g),cs=['Semua',...new Set(L.map(p=>p.category))],c=S.cat[g];
 return `<h2>${gl(g)}</h2><p class="mt" style="margin-top:-6px">Setelah beli, masukkan nomor WhatsApp aktif. Admin menghubungi atau mengirim pesananmu lewat WA.</p><div class="row" style="margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto">${cs.map((x,i)=>`<button class="g ${c==x?'on':''}" onclick="S.cat['${g}']=${JSON.stringify(x).replace(/"/g,'&quot;')};render()">${esc(x)}</button>`).join('')}</div><div class="grid">${L.filter(p=>c=='Semua'||p.category==c).map(p=>`<div class="card"><span class="tag">${esc(p.category)}</span><h3 style="margin:8px 0 2px">${esc(p.name)}</h3>${p.promo?'<span class="tag hi">PROMO</span>':''}<p class="pr">${rp(price(p.price))}${price(p.price)<p.price?` <s class="mt">${rp(p.price)}</s>`:''}</p><button onclick="openBuy(${p.id})">Beli</button></div>`).join('')||'<p class="mt">Belum ada produk.</p>'}</div>`}
const mockSvg=k=>{const r=(x,y,w,h,o=.14,rx=6)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" fill="#fff" fill-opacity="${o}"/>`;
 let b=r(14,36,292,22,.1,8)+r(22,43,60,8,.7,4)+r(268,41,28,12,.25,6);
 if(k=='mod')b+=[0,1,2,3].map(i=>r(14+i*50,66,44,14,i?.12:.8,7)).join('')+[0,1,2].map(i=>r(14+i*99,88,92,74,.1,8)+r(22+i*99,96,50,6,.7,3)+r(22+i*99,108,76,5,.25,3)+r(22+i*99,140,34,12,.85,6)).join('');
 else if(k=='acc')b+=[0,1].map(i=>r(14,66+i*50,292,44,.1,8)+r(22,72+i*50,32,32,.2,6)+r(62,74+i*50,100,7,.7,3)+r(62,87+i*50,150,5,.25,3)+r(62,97+i*50,60,5,.4,3)+r(250,82+i*50,46,16,.85,8)).join('');
 else b+=r(14,66,292,52,.16,10)+r(24,76,120,10,.8,5)+r(24,92,170,6,.3,3)+r(24,104,60,10,.9,5)+[0,1,2,3].map(i=>r(14+i*74,126,68,40,.1,8)+r(20+i*74,132,40,5,.5,3)+r(20+i*74,142,28,5,.25,3)).join('');
 b+=r(24,172,272,18,.12,9)+[0,1,2,3,4].map(i=>`<circle cx="${50+i*55}" cy="181" r="4" fill="#fff" fill-opacity="${i?.4:.9}"/>`).join('');
 return `<svg viewBox="0 0 320 200" style="width:100%;display:block;border-radius:10px;background:#050505;border:1px solid rgba(255,255,255,.15)"><rect width="320" height="26" fill="#111"/>${r(60,7,200,12,.1,6)}${b}</svg>`};
const imgOf=p=>p.img?`<img src="${esc(p.img)}" alt="" style="width:100%;border-radius:10px;display:block">`:mockSvg(p.mock);
function webPage(){return `<h2>Jasa Pembuatan Website</h2><p class="mt" style="margin-top:-6px">Pilih website, lihat fotonya, lalu pesan. Admin menghubungi kamu lewat WhatsApp.</p><div class="grid">${S.prods.filter(p=>p.game=='web').map(p=>`<div class="card"><div onclick="zoom(${p.id})" style="cursor:zoom-in">${imgOf(p)}</div><span class="tag" style="margin-top:10px;display:inline-block">${esc(p.category)}</span><h3 style="margin:6px 0 2px">${esc(p.name)}</h3><div class="mt">${esc(p.description)}</div><p class="pr">${rp(price(p.price))}</p><button onclick="openBuy(${p.id})">Pesan Website</button></div>`).join('')||'<p class="mt">Belum ada paket.</p>'}</div><div class="card"><b>Dll</b><p class="mt" style="margin:2px 0 0">Mau website lain? Pesan salah satu paket lalu jelaskan kebutuhanmu ke admin lewat WhatsApp.</p></div>`}
function zoom(id){const p=S.prods.find(x=>x.id==id);$('#modal').innerHTML=`<div class="card">${imgOf(p)}<h3>${esc(p.name)}</h3><p class="mt">${esc(p.description)}</p><button class="g" onclick="closeM()">Tutup</button></div>`;$('#modal').style.display='flex'}
function openBuy(id){if(!S.p){toast('Login dulu');return go('login')}const p=S.prods.find(x=>x.id==id);
 $('#modal').innerHTML=`<div class="card"><h3 style="margin-top:0">${esc(p.name)}</h3><p class="mt">${gl(p.game)}</p><div class="sum"><span>Harga</span><b>${rp(price(p.price))}</b></div><div class="sum"><span>Saldo kamu</span><b>${rp(S.p.balance)}</b></div><label>Nomor WhatsApp aktif</label><input id="wa" inputmode="tel" placeholder="08123456789" value="${esc(S.p.wa||'')}"><p class="mt">Admin akan menghubungi atau mengirim pesananmu ke nomor ini lewat WhatsApp setelah pembayaran masuk.</p><div class="row"><button id="bb" onclick="confirmBuy(${id})">Bayar dengan Saldo</button><button class="g" onclick="closeM()">Batal</button></div></div>`;$('#modal').style.display='flex'}
function normWA(v){v=v.replace(/[\s\-+]/g,'');if(v[0]=='0')v='62'+v.slice(1);return /^628\d{7,11}$/.test(v)?v:null}
async function confirmBuy(id){const wa=normWA($('#wa').value);if(!wa)return toast('Nomor WhatsApp tidak valid');$('#bb').disabled=true;
 const {error}=await SB.rpc('buy_product',{p_id:id,p_wa:wa});if(error){$('#bb').disabled=false;return toast(error.message=='Saldo kurang'?'Saldo kurang, hubungi admin untuk top up':error.message)}
 closeM();toast('Pembelian berhasil');await load();go('riwayat')}
function nokos(){return `<h2>Beli Nokos</h2><div class="card"><b>Segera aktif</b><p class="mt">Layanan dan harga nokos akan diambil langsung dari VirtuSIM (H2H). Harga di web sama dengan harga VirtuSIM${S.mk?` + markup ${rp(S.mk)}`:''}.</p></div>`}
function topup(){return `<h2>Top Up Saldo</h2><div class="card"><div class="sum"><span class="mt">Saldo kamu</span><b>${rp(S.p.balance)}</b></div><b>QRIS otomatis segera aktif</b><p class="mt">Sementara, isi saldo lewat admin. Setelah pembayaran dikonfirmasi, owner menambahkan saldo ke akunmu.</p>${S.wa?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(S.wa)}?text=${encodeURIComponent('Halo admin, saya mau top up saldo. Username: '+S.p.username)}">Hubungi Admin</a>`:'<p class="mt">Kontak admin belum diatur.</p>'}</div>`}
function riwayat(){const l=S.ords.filter(o=>o.user_id==S.u.id);return `<h2>Riwayat Pesanan</h2>${l.map(o=>`<div class="card"><div class="row"><b>${gl(o.kind)}: ${esc(o.name)}</b><span class="tag">${esc(o.status)}</span><span class="pr">${rp(o.price)}</span></div><div class="mt">${now(o.created_at)}</div><p class="mt">Admin akan menghubungi atau mengirim pesananmu ke WhatsApp <b style="color:#fff">${esc(o.wa)}</b>.</p></div>`).join('')||'<p class="mt">Belum ada pesanan.</p>'}`}
function admin(){const T=[['ord','Pesanan'],['usr','User'],['prd','Produk'],['set','Toko']],un=id=>(S.users.find(u=>u.id==id)||{}).username||'?';let b='';
 if(S.tab=='ord')b=`<p class="mt">${S.users.length} user · ${S.ords.length} pesanan · omzet ${rp(S.ords.reduce((a,o)=>a+o.price,0))}</p>`+(S.ords.map(o=>{const p=S.prods.find(x=>x.id==o.product_id);return `<div class="card"><div class="row"><b>${esc(o.name)}</b><span class="tag">${gl(o.kind)}</span><span class="tag">${esc(o.status)}</span></div><p class="mt" style="margin:4px 0">${esc(un(o.user_id))} · WA ${esc(o.wa)} · ${rp(o.price)}</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${esc(o.wa)}?text=${encodeURIComponent('Halo, pesanan '+o.name+' kamu sudah kami proses.'+(p&&p.link?' Link: '+p.link:''))}">Chat WhatsApp</a> ${o.status!='Terkirim'?`<button class="g" onclick="setSt(${o.id})">Tandai Terkirim</button>`:''}</div>`}).join('')||'<p class="mt">Belum ada pesanan.</p>');
 if(S.tab=='usr')b=`<div class="card tw"><table><tr><th>User</th><th>Level</th><th>Saldo</th><th></th></tr>${S.users.map(u=>`<tr><td>${esc(u.username)}</td><td>${lvTag(u.level)}</td><td>${rp(u.balance)}</td><td>${u.level!='owner'?`<button class="g" onclick="setLv('${u.id}','${u.level=='high'?'member':'high'}')">${u.level=='high'?'Jadikan Member':'Jadikan HIGH'}</button> <button class="g" onclick="addBal('${u.id}')">+Saldo</button>`:''}</td></tr>`).join('')}</table></div>`;
 if(S.tab=='prd')b=`<div class="card"><h3 style="margin-top:0">Tambah Produk</h3><select id="pg"><option value="samp">Modpack SAMP</option><option value="jasa">Jasa SAMP</option><option value="web">Jasa Website</option></select><input id="pn" placeholder="Nama"><input id="pc" placeholder="Kategori"><input id="pd" placeholder="Deskripsi singkat"><input id="pp" type="number" placeholder="Harga"><input id="pl" placeholder="Link file (dikirim lewat WA)"><label>Foto (opsional)</label><input id="pf" type="file" accept="image/*"><button onclick="addP()">Tambah</button></div><div class="card tw"><table>${S.prods.map(p=>`<tr><td>${gl(p.game)}</td><td>${esc(p.name)}</td><td>${rp(p.price)}</td><td><button class="g" onclick="pickImg(${p.id})">Foto</button> <button class="d" onclick="delP(${p.id})">Hapus</button></td></tr>`).join('')}</table></div>`;
 if(S.tab=='set')b=`<div class="card"><h3 style="margin-top:0">Pengaturan Toko</h3><label>Nama toko</label><div class="row" style="margin-bottom:8px">${['Monarch','Secret','Jefri'].map(n=>`<button class="g ${S.name==n?'on':''}" onclick="$('#nm').value='${n}'">${n}</button>`).join('')}</div><input id="nm" value="${esc(S.name)}"><label>Nomor WhatsApp admin (format 628xxx)</label><input id="aw" inputmode="tel" value="${esc(S.wa)}"><label>Markup nokos (Rp). 0 = sama dengan harga VirtuSIM</label><input id="mk" type="number" value="${S.mk}"><button onclick="saveSet()">Simpan</button></div>`;
 return `<h2>Panel Owner</h2><div class="row" style="margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto">${T.map(t=>`<button class="g ${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${b}`}
const fail=r=>{if(r.error){toast(r.error.message);return true}};
async function setSt(id){if(fail(await SB.from('orders').update({status:'Terkirim'}).eq('id',id)))return;await load()}
async function setLv(id,l){if(fail(await SB.from('profiles').update({level:l}).eq('id',id)))return;await load()}
async function addBal(id){const v=+prompt('Tambah saldo (Rp):');if(!v)return;const u=S.users.find(x=>x.id==id);if(fail(await SB.from('profiles').update({balance:u.balance+v}).eq('id',id)))return;toast('Saldo ditambahkan');await load()}
async function delP(id){if(!confirm('Hapus produk ini?'))return;if(fail(await SB.from('products').delete().eq('id',id)))return;await load()}
const shrink=f=>new Promise(res=>{const i=new Image();i.onload=()=>{const s=Math.min(1,720/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>res(b),'image/jpeg',.75)};i.onerror=()=>res(null);i.src=URL.createObjectURL(f)});
async function upImg(f){const b=await shrink(f);if(!b){toast('Gambar tidak valid');return null}const path=Date.now()+'.jpg',r=await SB.storage.from('foto').upload(path,b,{contentType:'image/jpeg'});if(fail(r))return null;return SB.storage.from('foto').getPublicUrl(path).data.publicUrl}
async function addP(){const name=$('#pn').value.trim(),price=+$('#pp').value;if(!name||!price)return toast('Isi nama & harga');const f=$('#pf').files[0];let img=null;if(f){img=await upImg(f);if(!img)return}
 if(fail(await SB.from('products').insert({game:$('#pg').value,name,category:$('#pc').value.trim()||'Lainnya',price,description:$('#pd').value.trim(),link:$('#pl').value.trim(),img,mock:'store'})))return;toast('Produk ditambahkan');await load()}
function pickImg(id){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(!i.files[0])return;const u=await upImg(i.files[0]);if(u&&!fail(await SB.from('products').update({img:u}).eq('id',id))){toast('Foto disimpan');await load()}};i.click()}
async function saveSet(){const r=await SB.from('settings').upsert([{key:'store_name',value:$('#nm').value.trim()||'Monarch'},{key:'admin_wa',value:$('#aw').value.replace(/\D/g,'')},{key:'markup',value:String(Math.max(0,+$('#mk').value||0))}]);if(fail(r))return;toast('Tersimpan');await load()}
function login(){return `<div class="card auth"><h2>Login</h2><label>Username</label><input id="lu" autocapitalize="none"><label>Password</label><input id="lp" type="password"><button id="lb" onclick="doLogin()">Masuk</button> <button class="g" onclick="go('register')">Daftar</button></div>`}
async function doLogin(){const u=$('#lu').value.trim().toLowerCase();if(!u)return toast('Isi username');$('#lb').disabled=true;const {error}=await SB.auth.signInWithPassword({email:u+'@monarch.app',password:$('#lp').value});
 if(error){$('#lb').disabled=false;return toast('Username/password salah')}await load();go(S.p&&S.p.level=='owner'?'admin':'home')}
function register(){return `<div class="card auth"><h2>Daftar Akun</h2><label>Username (huruf kecil/angka)</label><input id="ru" autocapitalize="none"><label>Password (min 6)</label><input id="rp" type="password"><label>Ulangi password</label><input id="rp2" type="password"><button id="rb" onclick="doReg()">Daftar</button> <button class="g" onclick="go('login')">Login</button></div>`}
async function doReg(){const u=$('#ru').value.trim().toLowerCase(),p=$('#rp').value;if(!/^[a-z0-9_]{3,15}$/.test(u))return toast('Username 3-15 huruf kecil/angka');if(p.length<6)return toast('Password min 6');if(p!=$('#rp2').value)return toast('Password tidak sama');$('#rb').disabled=true;
 const {data,error}=await SB.auth.signUp({email:u+'@monarch.app',password:p});if(error){$('#rb').disabled=false;return toast(error.message.includes('already')?'Username sudah dipakai':error.message)}
 if(!data.session){$('#rb').disabled=false;return toast('Pendaftaran butuh konfirmasi. Matikan Confirm email di Supabase')}toast('Berhasil daftar');await load();go('home')}
async function logout(){await SB.auth.signOut();await load();go('home')}
load();
</script></body></html>
