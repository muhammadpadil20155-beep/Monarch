<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monarch — Modpack SAMP & Nokos</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#030303;--card:rgba(12,12,12,.34);--bd:rgba(255,255,255,.13);--tx:#f5f5f5;--mt:#9a9a9a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:500 15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;padding-bottom:120px;background-color:var(--bg);background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:38px 38px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 15% 15%,rgba(255,255,255,.12),transparent 40%),radial-gradient(circle at 90% 70%,rgba(255,255,255,.09),transparent 45%)}
body::after{content:"";position:fixed;z-index:-1;pointer-events:none;width:280px;height:280px;border-radius:50%;background:#fff;opacity:.2;top:16%;right:-70px;box-shadow:-520px 380px 0 -30px rgba(255,255,255,.16)}
header,.card,nav,.modal{-webkit-backdrop-filter:blur(44px) saturate(1.2);backdrop-filter:blur(44px) saturate(1.2)}
header{position:sticky;top:env(safe-area-inset-top,0px);background:rgba(0,0,0,.3);border-bottom:1px solid var(--bd);z-index:5;padding:10px 14px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:16px;letter-spacing:.16em;display:flex;align-items:center;gap:9px}.logo svg{width:24px;height:24px}
button,.btn{font-family:inherit;background:#fff;color:#000;border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.g.on{border-color:#fff;background:#fff;color:#000}button.d{background:#3a3a3a;color:#fff}button.b{background:#2a2a2a;color:#fff}
.ib{width:40px;height:40px;padding:0;border-radius:50%;background:transparent;color:#fff;border:1px solid var(--bd);display:grid;place-items:center}.ib svg{width:20px;height:20px;fill:currentColor;stroke:none}
.menu{position:absolute;right:12px;top:calc(100% + 8px);min-width:220px;border:1px solid var(--bd);border-radius:18px;padding:8px;background:rgba(10,10,10,.9);display:none;box-shadow:0 14px 40px rgba(0,0,0,.7)}.menu.open{display:block}
.menu button{width:100%;display:flex;gap:12px;align-items:center;background:transparent;color:var(--tx);text-align:left;padding:12px;border-radius:12px}.menu button:hover{background:rgba(255,255,255,.1)}.menu svg{width:20px;height:20px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:calc(100% - 20px);max-width:640px;z-index:6;display:flex;gap:4px;padding:9px;border-radius:30px;background:rgba(10,10,10,.3);border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 40px rgba(0,0,0,.6)}
nav button{flex:1;min-width:0;background:transparent;color:var(--mt);border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:12px 2px}nav button svg{width:26px;height:26px}nav button.on{color:#000;background:#fff}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);box-shadow:0 8px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:rgba(0,0,0,.55);color:var(--tx);margin:4px 0 10px;font:inherit;font-size:14px}
label{font-size:13px;color:var(--mt)}h1,h2,h3{font-weight:800;letter-spacing:-.02em}h2{margin:6px 0 12px}.mt{color:var(--mt);font-size:13px}.pr{font-weight:800}
.tag{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--bd);margin-right:4px}.hi{background:#fff;color:#000}.ow{background:#555}
.hero{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border-radius:16px;padding:28px 18px;margin-bottom:14px;border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.auth{max-width:380px;margin:30px auto}.sum{display:flex;justify-content:space-between;padding:4px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.modal .card{width:100%;max-width:400px;background:rgba(14,14,14,.8)}
#toast{position:fixed;bottom:calc(128px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:99px;font-weight:700;display:none;z-index:30;white-space:nowrap}
</style></head><body>
<header><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 18h18M4 18L3 7l5 4 4-7 4 7 5-4-1 11"/></svg><span id="sn"></span></span><div id="who" class="row"></div><div id="menu" class="menu"></div></header>
<main id="app"></main><nav id="nav"></nav><div id="modal" class="modal" onclick="if(event.target==this)closeM()"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID'),now=()=>new Date().toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sv=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={home:sv('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>'),samp:sv('<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>'),jasa:sv('<path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/>'),nokos:sv('<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>'),topup:sv('<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M2 10h20M6 15h4"/>'),riwayat:sv('<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),admin:sv('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'),login:sv('<path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/>'),register:sv('<circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M19 8v6M16 11h6"/>'),out:sv('<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>'),dots:'<svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>'};
const P=(id,g,n,c,pr,v)=>({id,g,n,c,pr,v,l:''});
const SEED={users:[{u:'owner',p:'Owner@123',lv:'owner',bal:0}],apikey:'',orders:[],deps:[],dep:null,rotp:0,products:[
P(1,'mc','All The Mods 9','Tech',25000,'1.20.1 Forge'),P(2,'mc','RLCraft Ultimate','RPG',20000,'1.12.2 Forge'),P(3,'mc','SkyFactory 4','Skyblock',15000,'1.12.2 Forge'),P(4,'mc','Fabulously Optimized','Lite/PvP',10000,'1.21 Fabric'),P(5,'mc','Create: Adventure','Adventure',22000,'1.20.1 Forge'),P(6,'mc','Bedrock Addon Pack','Bedrock',12000,'Bedrock 1.21'),
P(7,'samp','SAMP Roleplay Starter Pack','Roleplay',30000,'0.3.7'),P(8,'samp','Mods Kendaraan HD','Kendaraan',15000,'0.3.7'),P(9,'samp','Skin & Map Pack Kota','Skin & Map',18000,'0.3.7'),P(10,'samp','Gamemode Freeroam Siap Pakai','Gamemode',40000,'0.3.7')]};
let db;try{db=JSON.parse(localStorage.getItem('bs_db'))}catch(e){}
if(!db)db=JSON.parse(JSON.stringify(SEED));
const PRODS=[P(11,'samp','MODPACK COMPE STYLE RP','Compe Style',10000,''),P(12,'samp','MODPACK COMPE STYLE TCW','Compe Style',3000,''),P(13,'samp','MODPACK STYLE GENGSTER HIGH','Style',10000,''),P(14,'samp','MODPACK STYLE JGRP','Style',5000,''),P(15,'samp','MODPACK STYLE LITTLE BATLEY','Style',5000,''),P(16,'samp','MODPACK IN DESC','Info Desc',10000,''),P(17,'samp','MODPACK STYLE ROBBERY','Style',5000,''),P(18,'jasa','PEMASANGAN MODS WEAPON','Pemasangan',1000,''),P(19,'jasa','PEMASANGAN MODS SKIN','Pemasangan',1000,''),P(20,'jasa','PEMASANGAN MODS GRAFIK','Pemasangan',2000,''),P(21,'jasa','PEMASANGAN MODS BLOODHIT','Pemasangan',1000,''),P(22,'jasa','PEMASANGAN MODS VEGETATION','Pemasangan',1000,''),P(23,'jasa','PEMASANGAN ALL MODS','Pemasangan',1000,''),P(24,'jasa','PEMBUATAN SKIN CIRCLE','Pembuatan',2000,'')];PRODS[PRODS.length-1].promo=1;
if(db.ver!=3){db.products=PRODS.map(x=>({...x}));db.ver=3}db.name=db.name||'Monarch';
db.deps=db.deps||[];db.rotp=db.rotp||0;db.dep=db.dep||null;db.orders=db.orders||[];
let ses=null,page='home',tab='ring',sel=20000;const cats={samp:'Semua',jasa:'Semua'},FEE=100,NOM=[5000,10000,20000,50000,100000,200000],MIN=2000;
try{ses=localStorage.getItem('bs_ses')}catch(e){}
const save=()=>{try{localStorage.setItem('bs_db',JSON.stringify(db))}catch(e){}};
const me=()=>db.users.find(x=>x.u===ses);
const toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2600)};
const price=p=>me()&&me().lv!=='member'?p*0.9:p;
const go=p=>{page=p;render()},tm=()=>$('#menu').classList.toggle('open'),closeM=()=>$('#modal').style.display='none';
const lvTag=l=>`<span class="tag ${l=='high'?'hi':l=='owner'?'ow':''}">${l.toUpperCase()}</span>`;
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('#menu').classList.remove('open')});
function render(){const m=me();$('#sn').textContent=db.name.toUpperCase();document.title=db.name+' — Modpack SAMP & Nokos';
 if(['topup','riwayat','admin'].includes(page)&&!m){toast('Login dulu');page='login'}
 if(page=='admin'&&m.lv!='owner')page='home';
 $('#nav').innerHTML=[['home','Beranda'],['samp','Modpack'],['jasa','Jasa'],['nokos','Nokos'],['topup','Top Up']].map(x=>`<button class="${page==x[0]?'on':''}" onclick="go('${x[0]}')">${IC[x[0]]}${x[1]}</button>`).join('');
 $('#who').innerHTML=(m?`<span class="mt">${lvTag(m.lv)} <b class="pr" style="color:#fff">${rp(m.bal)}</b></span>`:'')+`<button class="ib" aria-label="Menu" onclick="event.stopPropagation();tm()">${IC.dots}</button>`;
 const it=m?[['riwayat','Riwayat'],...(m.lv=='owner'?[['admin','Panel Owner']]:[]),['out','Keluar']]:[['login','Login'],['register','Daftar']];
 $('#menu').innerHTML=(m?`<div class="mt" style="padding:6px 12px">Masuk sebagai <b>${esc(m.u)}</b></div>`:'')+it.map(x=>`<button onclick="${x[0]=='out'?'logout()':`go('${x[0]}')`}">${IC[x[0]]}${x[1]}</button>`).join('');
 $('#menu').classList.remove('open');
 $('#app').innerHTML=({home,samp:()=>store('samp'),jasa:()=>store('jasa'),nokos,topup,riwayat,admin,login,register}[page])();window.scrollTo(0,0)}
function home(){const t=(p,n,d)=>`<div class="card" onclick="go('${p}')" style="cursor:pointer"><div style="width:28px">${IC[p]}</div><b>${n}</b><p class="mt" style="margin:2px 0 0">${d}</p></div>`;
 return `<div class="hero"><h1 style="margin:0 0 6px">${esc(db.name)}</h1><p style="margin:0 0 14px;color:var(--mt)">Modpack & jasa SAMP, plus nomor OTP otomatis. Top up QRIS, admin cuma ${rp(FEE)}.</p><button onclick="go('topup')">Top Up Sekarang</button></div><div class="grid">${t('samp','Modpack SAMP','Compe, Gengster, JGRP, Robbery')}${t('jasa','Jasa SAMP','Pasang mods & buat skin')}${t('nokos','Nokos OTP','Layanan RumahOTP + refresh')}${t('topup','Top Up QRIS','Saldo masuk otomatis')}</div>`}
const csOf=g=>['Semua',...new Set(db.products.filter(p=>p.g==g).map(p=>p.c))],setCat=(g,i)=>{cats[g]=csOf(g)[i];render()};
function store(g){const L=db.products.filter(p=>p.g==g&&(cats[g]=='Semua'||p.c==cats[g]));
 return `<h2>${g=='samp'?'Modpack SAMP':'Jasa SAMP'}</h2><p class="mt" style="margin-top:-6px">Setelah beli, masukkan nomor WhatsApp aktif. Admin menghubungi atau mengirim pesananmu lewat WA.</p><div class="row" style="margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto">${csOf(g).map((x,i)=>`<button class="g ${cats[g]==x?'on':''}" onclick="setCat('${g}',${i})">${esc(x)}</button>`).join('')}</div><div class="grid">${L.map(p=>`<div class="card"><span class="tag">${esc(p.c)}</span><h3 style="margin:8px 0 2px">${esc(p.n)}</h3><div class="mt">${p.promo?'<span class="tag hi">PROMO</span>':''}${esc(p.v||'')}</div><p class="pr">${rp(price(p.pr))}${price(p.pr)<p.pr?` <s class="mt">${rp(p.pr)}</s>`:''}</p><button onclick="openBuy(${p.id})">Beli</button></div>`).join('')||'<p class="mt">Belum ada produk.</p>'}</div>`}
function openBuy(id){const m=me();if(!m){toast('Login dulu');return go('login')}const p=db.products.find(x=>x.id==id);
 $('#modal').innerHTML=`<div class="card"><h3 style="margin-top:0">${esc(p.n)}</h3><p class="mt">${p.g=='samp'?'Modpack SAMP':'Jasa SAMP'}${p.promo?' · PROMO':''}</p><div class="sum"><span>Harga</span><b>${rp(price(p.pr))}</b></div><div class="sum"><span>Saldo kamu</span><b>${rp(m.bal)}</b></div><label>Nomor WhatsApp aktif</label><input id="wa" inputmode="tel" placeholder="08123456789" value="${esc(m.wa||'')}"><p class="mt">Admin akan menghubungi atau mengirim pesananmu ke nomor ini lewat WhatsApp setelah pembayaran masuk.</p><div class="row"><button onclick="confirmBuy(${id})">Bayar dengan Saldo</button><button class="g" onclick="closeM()">Batal</button></div></div>`;$('#modal').style.display='flex'}
function normWA(v){v=v.replace(/[\s\-+]/g,'');if(v[0]=='0')v='62'+v.slice(1);return /^628\d{7,11}$/.test(v)?v:null}
function confirmBuy(id){const m=me(),p=db.products.find(x=>x.id==id),wa=normWA($('#wa').value),h=price(p.pr);
 if(!wa)return toast('Nomor WhatsApp tidak valid');if(m.bal<h){closeM();toast('Saldo kurang, silakan top up');return go('topup')}
 m.bal-=h;m.wa=wa;db.orders.unshift({id:Date.now(),t:'Modpack',g:p.g,u:m.u,n:p.n,h,wa,l:p.l,st:'Menunggu dikirim admin',d:now()});save();closeM();toast('Pembelian berhasil');go('riwayat')}
const SV=[['WhatsApp',2500],['Telegram',2000],['Discord',1800],['Google',1500],['Facebook',1700],['Instagram',1900],['TikTok',1600],['Shopee',2200]],CT=[['Indonesia',1],['Malaysia',1.1],['USA',1.2]];
function nokos(){return `<h2>Beli Nokos</h2><div class="card"><label>Layanan</label><select id="sv">${SV.map((s,i)=>`<option value="${i}">${s[0]} — ${rp(s[1])}</option>`).join('')}</select><label>Negara</label><select id="ct">${CT.map((s,i)=>`<option value="${i}">${s[0]}</option>`).join('')}</select><button onclick="buyNokos()">Beli Nomor</button><p class="mt">Nomor aktif ±15 menit. Saldo kembali jika dibatalkan sebelum OTP masuk.</p></div>`}
function buyNokos(){const m=me();if(!m){toast('Login dulu');return go('login')}
 if(!db.apikey)return toast('Stok kosong: owner belum mengisi API key RumahOTP');
 const s=SV[$('#sv').value],c=CT[$('#ct').value],h=price(s[1]*c[1]);if(m.bal<h){toast('Saldo kurang');return go('topup')}
 m.bal-=h;const o={t:'Nokos',u:m.u,n:`${s[0]} ${c[0]}`,h,st:'Menunggu OTP',num:'+62'+(8e9+Math.floor(Math.random()*1e9)),otp:'',d:now(),id:Date.now()};
 db.orders.unshift(o);save();toast('Nomor didapat, menunggu OTP…');go('riwayat');
 setTimeout(()=>{const x=db.orders.find(q=>q.id==o.id);if(x&&x.st=='Menunggu OTP'){x.otp=String(Math.floor(1e5+Math.random()*9e5));x.st='OTP Masuk';save();if(page=='riwayat')render()}},6000)}
function cancel(id){const o=db.orders.find(x=>x.id==id);if(o&&o.st=='Menunggu OTP'){o.st='Dibatalkan';me().bal+=o.h;save();toast('Dibatalkan, saldo kembali');render()}}
function qr(s){let x=s%2147483647||7,r='';const N=25,f=(i,j)=>(i<8&&j<8)||(i<8&&j>16)||(i>16&&j<8);
 for(let i=0;i<N;i++)for(let j=0;j<N;j++){if(f(i,j))continue;x=x*16807%2147483647;if(x%100<48)r+=`<rect x="${j}" y="${i}" width="1" height="1"/>`}
 const fp=(a,b)=>`<rect x="${b}" y="${a}" width="7" height="7"/><rect x="${b+1}" y="${a+1}" width="5" height="5" fill="#fff"/><rect x="${b+2}" y="${a+2}" width="3" height="3"/>`;
 return `<svg viewBox="-2 -2 29 29" width="210" height="210" style="background:#fff;border-radius:14px"><g fill="#000">${r}${fp(0,0)}${fp(0,18)}${fp(18,0)}</g></svg>`}
const hist=m=>`<h3>Riwayat Top Up</h3><div class="card tw"><table>${db.deps.filter(t=>t.u==m.u).map(t=>`<tr><td>${t.d}</td><td>${rp(t.n)}</td><td>${t.st}</td></tr>`).join('')||'<tr><td class="mt">Belum ada</td></tr>'}</table></div>`;
function topup(){const m=me(),d=db.dep&&db.dep.u==m.u?db.dep:null;
 if(d)return `<h2>Bayar dengan QRIS</h2><div class="card" style="text-align:center">${qr(d.id)}<p class="mt">Scan dengan e-wallet atau m-banking apa pun</p><h2 style="margin:4px 0">${rp(d.n+FEE)}</h2><p class="mt">Saldo masuk ${rp(d.n)} · Admin ${rp(FEE)}</p><p>Bayar dalam <b id="cd">--:--</b></p><p class="mt">Menunggu pembayaran… saldo bertambah otomatis setelah pembayaran terdeteksi.</p><button onclick="paid()">Simulasi: Pembayaran Masuk</button> <button class="g" onclick="endDep('Dibatalkan')">Batalkan</button><p class="mt">Mode demo. Di versi live, pembayaran dideteksi otomatis lewat payment gateway.</p></div>`+hist(m);
 return `<h2>Top Up Saldo</h2><div class="card"><label>Pilih jumlah top up</label><div class="chips">${NOM.map(n=>`<button class="g ${sel==n?'on':''}" onclick="sel=${n};render()">${rp(n).replace('.000','rb')}</button>`).join('')}</div><label>Atau nominal lain (min Rp10.000)</label><input type="number" inputmode="numeric" placeholder="Contoh: 75000" onchange="sel=+this.value||sel;render()"><label>Metode pembayaran</label><div class="card" style="margin:4px 0 12px;border-color:#fff"><b>QRIS</b><br><span class="mt">Semua e-wallet & m-banking · otomatis</span></div><div class="sum"><span class="mt">Nominal top up</span><b>${rp(sel)}</b></div><div class="sum"><span class="mt">Biaya admin</span><b>${rp(FEE)}</b></div><div class="sum" style="border-top:1px solid var(--bd);margin:6px 0 12px;padding-top:10px"><span>Total bayar</span><b>${rp(sel+FEE)}</b></div><button style="width:100%" onclick="mkDep()">Buat QRIS</button></div>`+hist(m)}
function mkDep(){if(sel<10000)return toast('Minimal Rp10.000');db.dep={id:Date.now(),u:me().u,n:sel,st:'Menunggu',exp:Date.now()+6e5};save();render()}
function endDep(st){const d=db.dep;if(!d)return;d.st=st;db.deps.unshift({...d,d:now()});db.dep=null;save();render()}
function paid(){const d=db.dep;if(!d)return;const u=db.users.find(x=>x.u==d.u);u.bal+=d.n;db.rotp+=d.n;endDep('Berhasil');toast('Saldo bertambah '+rp(d.n))}
setInterval(()=>{const d=db.dep;if(!d)return;const l=d.exp-Date.now();if(l<=0){endDep('Kadaluarsa');return}const e=$('#cd');if(e)e.textContent=String(Math.floor(l/6e4)).padStart(2,'0')+':'+String(Math.floor(l/1e3)%60).padStart(2,'0')},1000);
function riwayat(){const l=db.orders.filter(o=>o.u==me().u);return `<h2>Riwayat Pesanan</h2>${l.map(o=>`<div class="card"><div class="row"><b>${o.t=='Nokos'?'Nokos':o.g=='jasa'?'Jasa SAMP':'Modpack SAMP'}: ${esc(o.n)}</b><span class="tag">${o.st}</span><span class="pr">${rp(o.h)}</span></div><div class="mt">${o.d}</div>${o.t=='Nokos'?`<p>Nomor: <b>${o.num}</b> ${o.otp?`· OTP: <b>${o.otp}</b>`:''}</p>${o.st=='Menunggu OTP'?`<button class="d" onclick="cancel(${o.id})">Batalkan</button>`:''}`:`<p class="mt">Admin akan menghubungi atau mengirim pesananmu ke WhatsApp <b style="color:#fff">${esc(o.wa)}</b>.</p>`}</div>`).join('')||'<p class="mt">Belum ada pesanan.</p>'}`}
function admin(){const T=[['ring','Ringkasan'],['api','API Key'],['ord','Pesanan'],['dep','Deposit'],['usr','User'],['prd','Produk'],['set','Toko']],mo=db.orders.filter(o=>o.t=='Modpack');let b='';
 if(tab=='ring')b=`<div class="grid"><div class="card">User<br><b class="pr">${db.users.length}</b></div><div class="card">Pesanan<br><b class="pr">${db.orders.length}</b></div><div class="card">Omzet<br><b class="pr">${rp(db.orders.filter(o=>o.st!='Dibatalkan').reduce((a,o)=>a+o.h,0))}</b></div><div class="card">Deposit ke RumahOTP<br><b class="pr">${rp(db.rotp)}</b></div><div class="card">Perlu dikirim<br><b class="pr">${mo.filter(o=>o.st!='Terkirim').length}</b></div></div>`;
 if(tab=='api')b=`<div class="card"><h3 style="margin-top:0">API Key RumahOTP</h3><p class="mt">Ambil API key di dashboard RumahOTP, lalu tempel di sini. QRIS top up dicetak lewat API ini, dan dana pembayaran masuk ke akun RumahOTP pemegang API key.</p><a class="btn" href="https://www.rumahotp.com" target="_blank" rel="noopener">Buka RumahOTP ↗</a><br><br><label>API Key</label><input id="ak" type="password" value="${esc(db.apikey)}" placeholder="Tempel API key"><button onclick="db.apikey=$('#ak').value.trim();save();toast('API key disimpan');render()">Simpan</button><p class="mt">Status: ${db.apikey?'Terpasang':'Belum diisi'} · Total masuk (catatan): ${rp(db.rotp)}</p></div>`;
 if(tab=='ord')b=mo.map(o=>`<div class="card"><div class="row"><b>${esc(o.n)}</b><span class="tag">${o.g=='jasa'?'Jasa':'Modpack'}</span><span class="tag">${o.st}</span></div><p class="mt" style="margin:4px 0">Pembeli ${esc(o.u)} · WA ${esc(o.wa)} · ${rp(o.h)}</p><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${o.wa}?text=${encodeURIComponent('Halo, pesanan '+o.n+' kamu sudah kami proses.'+(o.l?' Link: '+o.l:''))}">Chat WhatsApp</a> ${o.st!='Terkirim'?`<button class="g" onclick="db.orders.find(x=>x.id==${o.id}).st='Terkirim';save();render()">Tandai Terkirim</button>`:''}</div>`).join('')||'<p class="mt">Belum ada pesanan modpack.</p>';
 if(tab=='dep')b=`<div class="card tw"><table>${db.deps.map(t=>`<tr><td>${t.d}</td><td>${esc(t.u)}</td><td>${rp(t.n)}</td><td>+${rp(FEE)} admin</td><td>${t.st}</td></tr>`).join('')||'<tr><td class="mt">Kosong</td></tr>'}</table></div>`;
 if(tab=='usr')b=`<div class="card tw"><table><tr><th>User</th><th>Level</th><th>Saldo</th><th></th></tr>${db.users.map((u,i)=>`<tr><td>${esc(u.u)}</td><td>${lvTag(u.lv)}</td><td>${rp(u.bal)}</td><td>${u.lv!='owner'?`<button class="g" onclick="setLv(${i})">${u.lv=='high'?'Jadikan Member':'Jadikan HIGH'}</button> <button class="g" onclick="addBal(${i})">+Saldo</button>`:''}</td></tr>`).join('')}</table></div>`;
 if(tab=='prd')b=`<div class="card"><h3 style="margin-top:0">Tambah Produk</h3><select id="pg"><option value="samp">Modpack SAMP</option><option value="jasa">Jasa SAMP</option></select><input id="pn" placeholder="Nama"><input id="pc" placeholder="Kategori"><input id="pv" placeholder="Versi"><input id="pp" type="number" placeholder="Harga"><input id="pl" placeholder="Link file (dikirim lewat WA)"><button onclick="addP()">Tambah</button></div><div class="card tw"><table>${db.products.map(p=>`<tr><td>${p.g=='jasa'?'Jasa':'Modpack'}</td><td>${esc(p.n)}</td><td>${esc(p.c)}</td><td>${rp(p.pr)}</td><td><button class="d" onclick="db.products=db.products.filter(x=>x.id!=${p.id});save();render()">Hapus</button></td></tr>`).join('')}</table></div>`;
 if(tab=='set')b=`<div class="card"><h3 style="margin-top:0">Nama Toko</h3><div class="row" style="margin-bottom:10px">${['Monarch','Secret','Jefri'].map(n=>`<button class="g ${db.name==n?'on':''}" onclick="setName('${n}')">${n}</button>`).join('')}</div><label>Atau nama lain</label><input id="nm" value="${esc(db.name)}"><button onclick="setName($('#nm').value.trim())">Simpan</button></div>`;
 return `<h2>Panel Owner</h2><div class="row" style="margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto">${T.map(t=>`<button class="g ${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${b}`}
function setLv(i){const u=db.users[i];u.lv=u.lv=='high'?'member':'high';save();render()}
function addBal(i){const v=+prompt('Tambah saldo (Rp):');if(v){db.users[i].bal+=v;save();render()}}
function addP(){const n=$('#pn').value.trim(),p=+$('#pp').value;if(!n||!p)return toast('Isi nama & harga');db.products.push({id:Date.now(),g:$('#pg').value,n,c:$('#pc').value.trim()||'Lainnya',v:$('#pv').value,pr:p,l:$('#pl').value.trim()});save();render()}
function login(){return `<div class="card auth"><h2>Login</h2><label>Username</label><input id="lu"><label>Password</label><input id="lp" type="password"><button onclick="doLogin()">Masuk</button> <button class="g" onclick="go('register')">Daftar</button></div>`}
function doLogin(){const u=db.users.find(x=>x.u==$('#lu').value.trim()&&x.p==$('#lp').value);if(!u)return toast('Username/password salah');ses=u.u;try{localStorage.setItem('bs_ses',ses)}catch(e){}page=u.lv=='owner'?'admin':'home';render()}
function register(){return `<div class="card auth"><h2>Daftar Akun</h2><label>Username</label><input id="ru"><label>Password (min 6)</label><input id="rp" type="password"><label>Ulangi password</label><input id="rp2" type="password"><button onclick="doReg()">Daftar</button> <button class="g" onclick="go('login')">Login</button></div>`}
function doReg(){const u=$('#ru').value.trim(),p=$('#rp').value;if(!/^[a-zA-Z0-9_]{3,15}$/.test(u))return toast('Username 3-15 huruf/angka');if(p.length<6)return toast('Password min 6');if(p!=$('#rp2').value)return toast('Password tidak sama');if(db.users.some(x=>x.u.toLowerCase()==u.toLowerCase()))return toast('Username dipakai');db.users.push({u,p,lv:'member',bal:0});save();toast('Berhasil daftar, silakan login');go('login')}
function logout(){ses=null;try{localStorage.removeItem('bs_ses')}catch(e){}go('home')}
function setName(n){if(!n)return;db.name=n.slice(0,24);save();toast('Nama toko disimpan');render()}
const NS='WhatsApp,Telegram,Instagram,Facebook,TikTok,Google,Gmail,Discord,Shopee,Tokopedia,Lazada,Gojek,Grab,DANA,OVO,GoPay,ShopeePay,LinkAja,Twitter / X,Line,WeChat,Viber,Signal,Snapchat,Tinder,Bumble,Netflix,Spotify,Amazon,PayPal,Binance,OpenAI,Microsoft,Yahoo,Steam,Free Fire,Mobile Legends,PUBG,Roblox,Twitch,Zalo,KakaoTalk,Bigo Live,Likee,Blibli,Traveloka,Alfagift,Indomaret'.split(','),NC=[['Indonesia',1],['Malaysia',1.1],['Thailand',1.15],['Vietnam',1.1],['Filipina',1.2],['India',1.05],['USA',1.5],['UK',1.5]];
const hs=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7),nprice=i=>1000+(hs(NS[i])%40)*100,nstock=i=>{const v=hs(NS[i]+nk.k);return v%7==0?0:v%150+5};
let nk={t:Date.now(),k:1},nsel=0,nq='';
function nokos(){setTimeout(nkl,0);return `<h2>Beli Nokos</h2><div class="card"><div class="row" style="justify-content:space-between"><b>Layanan RumahOTP</b><button class="g" style="display:flex;gap:6px;align-items:center" onclick="nkRef()"><span style="width:16px">${sv('<path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 3v6h-6"/>')}</span>Refresh</button></div><p class="mt" id="nkt"></p><input placeholder="Cari layanan…" value="${esc(nq)}" oninput="nq=this.value;nkl()"><div id="nkl" style="max-height:330px;overflow-y:auto;margin-bottom:10px"></div><label>Negara</label><select id="ct">${NC.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('')}</select><button style="width:100%" onclick="buyNokos()">Beli Nomor</button><p class="mt">Nomor aktif ±15 menit. Saldo kembali jika dibatalkan sebelum OTP masuk. Daftar layanan demo; versi live diambil dari API RumahOTP lewat backend.</p></div>`}
function nkl(){const e=$('#nkl');if(!e)return;const q=nq.toLowerCase();e.innerHTML=NS.map((s,i)=>[s,i]).filter(x=>x[0].toLowerCase().includes(q)).map(([s,i])=>{const st=nstock(i);return `<div class="sum" onclick="nsel=${i};nkl()" style="cursor:pointer;padding:10px;border-radius:10px;border:1px solid ${nsel==i?'#fff':'transparent'};opacity:${st?1:.4}"><span><b>${s}</b> <span class="mt">stok ${st}</span></span><b>${rp(price(nprice(i)))}</b></div>`}).join('')||'<p class="mt">Tidak ditemukan</p>';$('#nkt').textContent='Diperbarui '+new Date(nk.t).toLocaleTimeString('id-ID')+' · '+NS.length+' layanan'}
function nkRef(){nk.k++;nk.t=Date.now();nkl();toast('Daftar layanan diperbarui')}
function buyNokos(){const m=me();if(!m){toast('Login dulu');return go('login')}
 if(!db.apikey)return toast('Stok kosong: owner belum mengisi API key RumahOTP');
 const c=NC[$('#ct').value],s=NS[nsel];if(!nstock(nsel))return toast('Stok habis, coba refresh');const h=price(nprice(nsel)*c[1]);if(m.bal<h){toast('Saldo kurang');return go('topup')}
 m.bal-=h;const o={t:'Nokos',u:m.u,n:`${s} ${c[0]}`,h,st:'Menunggu OTP',num:'+62'+(8e9+Math.floor(Math.random()*1e9)),otp:'',d:now(),id:Date.now()};
 db.orders.unshift(o);save();toast('Nomor didapat, menunggu OTP…');go('riwayat');
 setTimeout(()=>{const x=db.orders.find(q=>q.id==o.id);if(x&&x.st=='Menunggu OTP'){x.otp=String(Math.floor(1e5+Math.random()*9e5));x.st='OTP Masuk';save();if(page=='riwayat')render()}},6000)}
function mkDep(){if(!db.apikey)return toast('Top up belum aktif: owner belum mengisi API key RumahOTP');if(sel<MIN)return toast('Minimal '+rp(MIN));db.dep={id:Date.now(),u:me().u,n:sel,st:'Menunggu',exp:Date.now()+6e5,via:'RumahOTP'};save();render()}
function topup(){const m=me(),d=db.dep&&db.dep.u==m.u?db.dep:null;
 if(d)return `<h2>Bayar dengan QRIS</h2><div class="card" style="text-align:center">${qr(d.id)}<p class="mt">QRIS dicetak lewat RumahOTP · ID RO-${String(d.id).slice(-6)}</p><h2 style="margin:4px 0">${rp(d.n+FEE)}</h2><p class="mt">Saldo masuk ${rp(d.n)} · Admin ${rp(FEE)}</p><p>Bayar dalam <b id="cd">--:--</b></p><p class="mt">Setelah dibayar, dana masuk ke akun RumahOTP pemegang API key dan saldo kamu bertambah otomatis.</p><button onclick="paid()">Simulasi: Pembayaran Masuk</button> <button class="g" onclick="endDep('Dibatalkan')">Batalkan</button><p class="mt">Mode demo. Versi live butuh backend yang memanggil API RumahOTP.</p></div>`+hist(m);
 return `<h2>Top Up Saldo</h2><div class="card"><label>Pilih jumlah top up</label><div class="chips">${NOM.map(n=>`<button class="g ${sel==n?'on':''}" onclick="sel=${n};render()">${rp(n).replace('.000','rb')}</button>`).join('')}</div><label>Atau nominal lain (min ${rp(MIN)})</label><input type="number" inputmode="numeric" placeholder="Contoh: 75000" onchange="sel=+this.value||sel;render()"><label>Metode pembayaran</label><div class="card" style="margin:4px 0 12px;border-color:#fff"><b>QRIS · RumahOTP</b><br><span class="mt">Semua e-wallet & m-banking · otomatis</span></div><div class="sum"><span class="mt">Nominal top up</span><b>${rp(sel)}</b></div><div class="sum"><span class="mt">Biaya admin</span><b>${rp(FEE)}</b></div><div class="sum" style="border-top:1px solid var(--bd);margin:6px 0 12px;padding-top:10px"><span>Total bayar</span><b>${rp(sel+FEE)}</b></div><button style="width:100%" onclick="mkDep()">Buat QRIS</button></div>`+hist(m)}
render();
</script></body></html>
